<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../quiz_icon.svg" type="image/x-icon" />
    <title>Mathématiques : Probabilités – Vocabulaire et Calculs</title>
    <style>
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }

        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      @keyframes headerDrop {
        from {
          opacity: 0;
          transform: translateY(-50px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }

        40% {
          transform: translateY(-5px);
        }

        60% {
          transform: translateY(-3px);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }

        20%,
        60% {
          transform: translateX(-5px);
        }

        40%,
        80% {
          transform: translateX(5px);
        }
      }

      @keyframes zoomFeedback {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }

        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes couleur-qui-change {
        0%,
        10% {
          color: white;
        }

        30% {
          color: #00ff00;
        }

        38% {
          color: #ffff00;
        }

        46% {
          color: #ff00ff;
        }

        54% {
          color: #00ffff;
        }

        60% {
          color: #ffa500;
        }

        68% {
          color: #7cfc00;
        }

        76% {
          color: #ff69b4;
        }

        84% {
          color: #8a2be2;
        }

        92% {
          color: #ff4500;
        }

        100% {
          color: deeppink;
        }
      }

      @keyframes wipe-in {
        from {
          clip-path: inset(0 100% 0 0);
        }

        to {
          clip-path: inset(0 0 0 0);
        }
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f0f4f8;
        padding: 1rem;
        line-height: 1.6;
        min-height: 100vh;
      }

      .quiz-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        overflow: hidden;
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #1a202c;
        animation: headerDrop 0.8s ease-out;
      }

      .progress-bar-container {
        width: 100%;
        height: 8px;
        background-color: #edf2f7;
        border-radius: 4px;
        margin-bottom: 20px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #4c51bf, #667eea);
        width: 0%;
        transition: width 0.4s ease-out;
      }

      .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        animation: slideIn 0.6s ease-out;
      }

      .nav-btn {
        display: block;
        width: 100%;
        padding: 1.5rem;
        text-align: center;
        border-radius: 15px;
        transition: all 0.2s;
        font-weight: 700;
        border: 2px solid #c3dafe;
        color: #2b6cb0;
        background-color: #ebf4ff;
        cursor: pointer;
        box-sizing: border-box;
      }

      .nav-btn:hover {
        background-color: #cee0f2;
        transform: translateY(-3px);
        border-color: #4c51bf;
      }

      .question-card {
        min-height: 200px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        border-radius: 15px;
        background-color: #f7faff;
        border: 2px solid #e2e8f0;
        opacity: 0;
        transform: translateY(20px);
      }

      .question-card.entering {
        animation: slideIn 0.5s ease-out forwards;
      }

      .question-card.fast-exit {
        animation: slideOut 0.3s ease-in forwards;
      }

      .question-text {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: #2d3748;
      }

      .img-container {
        text-align: center;
        margin: 15px 0;
      }

      .img-container img {
        max-width: 100%;
        border-radius: 8px;
      }

      .options-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .option-item {
        position: relative;
      }

      .option-item input[type="radio"] {
        position: absolute;
        opacity: 0;
        height: 0;
        width: 0;
      }

      .answer-btn {
        display: block;
        width: 100%;
        padding: 1rem 1.25rem;
        text-align: left;
        border-radius: 10px;
        transition: all 0.2s;
        font-weight: 600;
        border: 1px solid #c3dafe;
        color: #2b6cb0;
        background-color: #ebf4ff;
        cursor: pointer;
        box-sizing: border-box;
      }

      .answer-btn:hover {
        background-color: #cee0f2;
        transform: translateY(-1px);
      }

      .option-item input:checked + .answer-btn {
        background-color: #3182ce;
        border-color: #2c5282;
        color: white;
      }

      .answer-btn.correct {
        background-color: #48bb78 !important;
        border-color: #2f855a !important;
        color: white !important;
        animation: bounce 0.6s ease-out;
      }

      .answer-btn.incorrect {
        background-color: #f56565 !important;
        border-color: #c53030 !important;
        color: white !important;
        animation: shake 0.5s ease-in-out;
      }

      .text-input-styled {
        width: 100%;
        padding: 1rem 1.25rem;
        font-size: 1.1rem;
        border: 2px solid #c3dafe;
        border-radius: 10px;
        box-sizing: border-box;
      }

      .text-input-styled.correct {
        border-color: #48bb78;
        background-color: #f0fff4;
        color: #2f855a;
        animation: bounce 0.6s ease-out;
      }

      .text-input-styled.incorrect {
        border-color: #f56565;
        background-color: #fff5f5;
        color: #c53030;
        animation: shake 0.5s ease-in-out;
      }

      #feedback-area {
        margin-top: 1rem;
        padding: 1.5rem;
        border-radius: 10px;
        font-weight: 500;
        display: none;
        opacity: 0;
      }

      #feedback-area.visible {
        display: block;
        animation: zoomFeedback 0.4s forwards;
      }

      .feedback-correct {
        background-color: #e6fffa;
        color: #276749;
        border: 1px solid #48bb78;
      }

      .feedback-incorrect {
        background-color: #fff5f5;
        color: #c53030;
        border: 1px solid #f56565;
      }

      .main-btn-container {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
      }

      #main-btn {
        background-color: #4c51bf;
        color: white;
        padding: 1rem 2.5rem;
        border-radius: 12px;
        font-weight: 800;
        font-size: 1.1rem;
        transition: all 0.3s;
        width: 100%;
        border: none;
        cursor: pointer;
      }

      #main-btn:disabled {
        background-color: #a0aec0;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .math-frac {
        display: inline-block;
        vertical-align: middle;
        text-align: center;
        font-size: 0.9em;
      }

      .math-num {
        border-bottom: 1px solid;
        display: block;
        padding: 0 2px;
      }

      .math-den {
        display: block;
        padding: 0 2px;
      }

      .couleur-qui-change {
        animation: couleur-qui-change 14s infinite alternate;
        font-weight: bold;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div class="quiz-container">
      <div class="header">
        <h1>Probabilités – Vocabulaire et Calculs</h1>
        <p class="anim-wipe-in">Troisième - QCM Aléatoire</p>
      </div>
      <div id="nav-container" class="nav-grid"></div>

      <div id="quiz-ui" class="hidden">
        <div class="progress-bar-container">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            color: #a0aec0;
            font-size: 0.9em;
            margin-bottom: 10px;
            font-weight: 600;
          "
        >
          <span id="cat-label">CATÉGORIE</span>
          <span id="counter-label">1/10</span>
        </div>

        <div id="question-card-container" class="question-card entering">
          <div id="question-text" class="question-text"></div>
          <div id="image-area" class="img-container hidden"></div>

          <div id="input-area"></div>
        </div>

        <div id="feedback-area"></div>

        <div class="main-btn-container">
          <button id="main-btn" onclick="app.checkAnswer()">
            Valider la réponse
          </button>
        </div>
      </div>
    </div>

    <script>
      const db = [
        {
          category: "Probabilités : Vocabulaire et Fondamentaux",
          questions: [
            {
              text: "Comment appelle-t-on un événement qui ne contient aucune issue ?",
              type: "mcq",
              options: [
                "Événement certain",
                "Événement impossible",
                "Événement élémentaire",
              ],
              correct: 1,
              solution:
                "Un événement qui ne peut pas se réaliser est appelé événement impossible (ou vide).",
            },
            {
              text: "L'ensemble de tous les résultats possibles d'une expérience s'appelle :",
              type: "text",
              accepted: ["univers", "l'univers", "Ω", "omega"],
              solution:
                "L'univers (souvent noté Ω) regroupe toutes les issues possibles.",
            },
            {
              text: "Quelle est la probabilité d'un événement certain ?",
              type: "text",
              accepted: ["1", "100%"],
              solution:
                "Un événement certain se réalise toujours, sa probabilité est donc égale à 1.",
            },
            {
              text: "Deux événements qui ne peuvent pas se produire en même temps sont dits :",
              type: "mcq",
              options: ["Incompatibles", "Contraires", "Élémentaires"],
              correct: 0,
              solution:
                "Des événements incompatibles n'ont aucune issue en commun.",
            },
            {
              text: "Un événement composé d'une seule issue est un événement :",
              type: "text",
              accepted: ["élémentaire", "elementaire"],
              solution: "C'est la définition d'un événement élémentaire.",
            },
            {
              text: "Si P(A) = 0.4, alors P(A Barre) est égal à :",
              type: "text",
              accepted: ["0.6", "0,6"],
              solution: "P(A Barre) = 1 - P(A) = 1 - 0.4 = 0.6.",
            },
            {
              text: "On lance un dé à 6 faces. L'événement 'Obtenir un 7' est un événement :",
              type: "mcq",
              options: ["Certain", "Élémentaire", "Impossible"],
              correct: 2,
              solution: "Un dé à 6 faces ne possède pas de face 7.",
            },
            {
              text: "Dénombrer un ensemble signifie :",
              type: "mcq",
              options: [
                "Compter ses éléments",
                "Calculer sa probabilité",
                "Lister ses issues",
              ],
              correct: 0,
              solution:
                "Dénombrer revient à déterminer le nombre d'éléments composants l'ensemble.",
            },
            {
              text: "La probabilité d'un événement est toujours comprise entre :",
              type: "mcq",
              options: ["-1 et 1", "0 et 1", "0 et 100"],
              correct: 1,
              solution:
                "Une probabilité est une valeur réelle entre 0 (impossible) et 1 (certain).",
            },
            {
              text: "Si une expérience a 4 issues équiprobables, la probabilité d'une issue est :",
              type: "text",
              accepted: ["1/4", "0.25", "0,25"],
              solution:
                "En cas d'équiprobabilité, P = <div class='math-frac'><span class='math-num'>1</span><span class='math-den'>4</span></div>.",
            },
          ],
        },
        {
          category: "Lancers de dés et Urnes",
          questions: [
            {
              text: "Dé à 12 faces : Quelle est la probabilité d'obtenir un multiple de 5 (5 ou 10) ?",
              type: "text",
              accepted: ["2/12", "1/6", "0.166"],
              solution: "Il y a 2 issues favorables sur 12 au total.",
            },
            {
              text: "Dé à 6 faces : Probabilité d'obtenir un nombre strictement supérieur à 4 ?",
              type: "text",
              accepted: ["2/6", "1/3"],
              solution: "Les issues sont 5 et 6, soit 2 issues sur 6.",
            },
            {
              text: "Urne (5 rouges, 3 vertes) : Probabilité de tirer une verte ?",
              type: "text",
              accepted: ["3/8", "0.375"],
              solution: "Issues favorables (3) / Total issues (8).",
            },
            {
              text: "Urne (10 bleues, 10 noires) : Probabilité de tirer une bleue ?",
              type: "text",
              accepted: ["1/2", "0.5", "10/20"],
              solution: "La moitié des billes sont bleues.",
            },
            {
              text: "Dé à 6 faces : Probabilité d'obtenir un nombre pair ?",
              type: "text",
              accepted: ["1/2", "0.5", "3/6"],
              solution: "Issues {2, 4, 6} sur 6 au total.",
            },
            {
              text: "On tire une carte dans un jeu de 32. Probabilité d'avoir un As ?",
              type: "text",
              accepted: ["4/32", "1/8", "0.125"],
              solution: "Il y a 4 As dans un jeu de 32 cartes.",
            },
            {
              text: "Dé à 12 faces : Probabilité d'obtenir un nombre premier inférieur à 10 {2, 3, 5, 7} ?",
              type: "text",
              accepted: ["4/12", "1/3"],
              solution: "4 issues favorables sur 12.",
            },
            {
              text: "Une pièce de monnaie équilibrée : Probabilité de faire 'Pile' ?",
              type: "text",
              accepted: ["1/2", "0.5"],
              solution: "Il y a 2 issues possibles (Pile ou Face).",
            },
            {
              text: "Urne (2 jaunes, 8 rouges) : Quelle est la probabilité de NE PAS tirer une jaune ?",
              type: "text",
              accepted: ["8/10", "4/5", "0.8"],
              solution: "L'événement contraire de jaune est rouge.",
            },
            {
              text: "Dé à 6 faces : Probabilité d'obtenir un chiffre inférieur ou égal à 6 ?",
              type: "text",
              accepted: ["1", "6/6"],
              solution: "C'est un événement certain.",
            },
          ],
        },
        {
          category: "Opérations sur les événements",
          questions: [
            {
              text: "L'intersection de A et B (A ∩ B) correspond à :",
              type: "mcq",
              options: ["A ou B", "A et B", "A seulement"],
              correct: 1,
              solution:
                "L'intersection contient les issues communes aux deux événements.",
            },
            {
              text: "L'union de A et B (A U B) correspond à :",
              type: "mcq",
              options: ["A ou B", "A et B", "Le contraire de A"],
              correct: 0,
              solution:
                "L'union contient les issues qui sont dans A, dans B, ou dans les deux.",
            },
            {
              text: "Si P(A)=0.3, P(B)=0.4 et A et B sont incompatibles, P(A U B) = ?",
              type: "text",
              accepted: ["0.7", "0,7"],
              solution: "Si incompatibles, P(A U B) = P(A) + P(B).",
            },
            {
              text: "Formule générale : P(A U B) est égal à :",
              type: "mcq",
              options: ["P(A) + P(B)", "P(A) + P(B) - P(A ∩ B)", "P(A) × P(B)"],
              correct: 1,
              solution:
                "Il faut soustraire l'intersection pour ne pas compter les issues communes deux fois.",
            },
            {
              text: "Si P(A)=0.5, P(B)=0.3 et P(A ∩ B)=0.1, alors P(A U B) = ?",
              type: "text",
              accepted: ["0.7", "0,7"],
              solution: "0.5 + 0.3 - 0.1 = 0.7.",
            },
            {
              text: "Si A et B sont contraires, alors P(A) + P(B) est égal à :",
              type: "text",
              accepted: ["1"],
              solution:
                "Des événements contraires couvrent tout l'univers sans intersection.",
            },
            {
              text: "Lancer de dé 6 faces. A={2,4,6}, B={4,5,6}. Quelles sont les issues de A ∩ B ?",
              type: "text",
              accepted: ["4,6", "4;6", "{4,6}"],
              solution:
                "Les chiffres présents dans les deux ensembles sont 4 et 6.",
            },
            {
              text: "Lancer de dé 6 faces. A={1,2}, B={5,6}. A et B sont-ils incompatibles ?",
              type: "mcq",
              options: ["Oui", "Non"],
              correct: 0,
              solution: "Ils n'ont aucune issue en commun.",
            },
            {
              text: "P(Ω) est toujours égal à :",
              type: "text",
              accepted: ["1"],
              solution: "L'univers contient toutes les issues possibles.",
            },
            {
              text: "Si P(A) = 1, l'événement A est dit :",
              type: "text",
              accepted: ["certain"],
              solution: "Il se produira à chaque expérience.",
            },
          ],
        },
        {
          category: "Arbres et Expériences à deux étapes",
          questions: [
            {
              text: "Dans un arbre pondéré, la somme des probabilités issues d'un même nœud est :",
              type: "text",
              accepted: ["1"],
              solution:
                "Toutes les possibilités partant d'un point doivent totaliser 100%.",
            },
            {
              text: "Pour calculer la probabilité d'un chemin complet dans un arbre, on :",
              type: "mcq",
              options: [
                "Additionne les probabilités",
                "Multiplie les probabilités",
                "Soustrait les probabilités",
              ],
              correct: 1,
              solution: "On multiplie les probabilités le long des branches.",
            },
            {
              text: "On lance une pièce puis un dé. Combien d'issues possède l'univers ?",
              type: "text",
              accepted: ["12"],
              solution: "2 (pile/face) × 6 (dé) = 12 issues.",
            },
            {
              text: "Urne (3R, 2B). On tire deux billes AVEC remise. Probabilité d'avoir (R, R) ?",
              type: "text",
              accepted: ["9/25", "0.36"],
              solution: "(3/5) × (3/5) = 9/25.",
            },
            {
              text: "Urne (3R, 2B). On tire deux billes SANS remise. Probabilité d'avoir (R, R) ?",
              type: "text",
              accepted: ["6/20", "3/10", "0.3"],
              solution: "(3/5) × (2/4) = 6/20.",
            },
            {
              text: "Si un chemin a une probabilité de 1/2 puis 1/3, la probabilité finale est :",
              type: "text",
              accepted: ["1/6"],
              solution: "1/2 × 1/3 = 1/6.",
            },
            {
              text: "Dans un arbre à deux étapes, si l'étape 1 a 3 branches et l'étape 2 en a 2, il y a :",
              type: "text",
              accepted: ["6", "6 issues"],
              solution: "3 × 2 = 6 chemins possibles.",
            },
            {
              text: "Vrai ou Faux : Un arbre pondéré peut représenter des tirages sans remise.",
              type: "mcq",
              options: ["Vrai", "Faux"],
              correct: 0,
              solution:
                "Oui, il suffit de modifier les probabilités au second niveau.",
            },
            {
              text: "Lancer de 2 pièces. Probabilité d'avoir au moins un 'Pile' ?",
              type: "text",
              accepted: ["3/4", "0.75"],
              solution:
                "Issues : (P,P), (P,F), (F,P). Seul (F,F) ne convient pas. 1 - 1/4 = 3/4.",
            },
            {
              text: "Un arbre où chaque branche a la même probabilité est un arbre :",
              type: "text",
              accepted: ["équiprobable"],
              solution: "Toutes les issues ont la même chance de se produire.",
            },
          ],
        },
        {
          category: "Situations Problèmes",
          questions: [
            {
              text: "Un code à 2 chiffres. Combien de combinaisons possibles (00 à 99) ?",
              type: "text",
              accepted: ["100"],
              solution:
                "10 choix pour le premier, 10 pour le second : 10 × 10 = 100.",
            },
            {
              text: "Dans une classe de 30, 10 aiment le foot, 15 le basket, 5 les deux. Probabilité qu'un élève aime l'un ou l'autre ?",
              type: "text",
              accepted: ["20/30", "2/3"],
              solution: "(10 + 15 - 5) / 30 = 20/30.",
            },
            {
              text: "Un sac contient des jetons numérotés de 1 à 20. Probabilité de tirer un multiple de 7 ?",
              type: "text",
              accepted: ["2/20", "1/10", "0.1"],
              solution: "Multiples : 7 et 14.",
            },
            {
              text: "On tire une boule dans une urne (4V, 6R). Si elle est verte, on gagne. Probabilité de perdre ?",
              type: "text",
              accepted: ["6/10", "0.6", "3/5"],
              solution: "Perdre = tirer une rouge.",
            },
            {
              text: "Une roue de loterie a 8 secteurs égaux. 1 secteur gagne 10€, 3 gagnent 5€. Probabilité de ne rien gagner ?",
              type: "text",
              accepted: ["4/8", "1/2", "0.5"],
              solution: "Secteurs perdants : 8 - 1 - 3 = 4.",
            },
            {
              text: "Quelle est la probabilité d'obtenir un total de 2 en lançant deux dés à 6 faces ?",
              type: "text",
              accepted: ["1/36"],
              solution: "Seule l'issue (1,1) convient sur 36 possibilités.",
            },
            {
              text: "Si on lance 3 fois une pièce, quelle est la probabilité de faire 3 fois 'Face' ?",
              type: "text",
              accepted: ["1/8", "0.125"],
              solution: "1/2 × 1/2 × 1/2 = 1/8.",
            },
            {
              text: "Une boîte contient 50 ampoules dont 2 sont défectueuses. Probabilité d'en tirer une bonne ?",
              type: "text",
              accepted: ["48/50", "24/25", "0.96"],
              solution: "48 ampoules sur 50 ne sont pas défectueuses.",
            },
            {
              text: "Probabilité de tirer un 'Cœur' dans un jeu de 32 cartes ?",
              type: "text",
              accepted: ["8/32", "1/4", "0.25"],
              solution: "Il y a 4 familles, donc 8 cartes par famille.",
            },
            {
              text: "Un QCM a 4 réponses par question. Quelle est la probabilité de répondre juste au hasard ?",
              type: "text",
              accepted: ["1/4", "0.25"],
              solution: "1 bonne réponse sur 4 choix.",
            },
          ],
        },
        {
          category: "Récapitulatif et Logique",
          questions: [
            {
              text: "P(A) + P(A Barre) = ?",
              type: "text",
              accepted: ["1"],
              solution: "C'est une propriété fondamentale des probabilités.",
            },
            {
              text: "L'événement 'Obtenir un nombre compris entre 1 et 6' pour un dé à 6 faces est :",
              type: "mcq",
              options: ["Impossible", "Élémentaire", "Certain"],
              correct: 2,
              solution: "Toutes les issues du dé sont comprises entre 1 et 6.",
            },
            {
              text: "Que signifie équiprobabilité ?",
              type: "mcq",
              options: [
                "Plusieurs issues possibles",
                "Toutes les issues ont la même probabilité",
                "La probabilité est de 0.5",
              ],
              correct: 1,
              solution: "Chaque issue a exactement la même chance de sortir.",
            },
            {
              text: "L'intersection de deux événements incompatibles est :",
              type: "mcq",
              options: ["L'univers", "L'ensemble vide", "Un événement certain"],
              correct: 1,
              solution: "Incompatibles = pas d'issues communes.",
            },
            {
              text: "Si P(A) = 0.8, est-il possible que P(A ∩ B) = 0.9 ?",
              type: "mcq",
              options: ["Oui", "Non"],
              correct: 1,
              solution:
                "L'intersection ne peut pas être plus grande que l'événement lui-même.",
            },
            {
              text: "Calculer P(A) si A possède 5 issues favorables sur un total de 25.",
              type: "text",
              accepted: ["5/25", "1/5", "0.2"],
              solution: "5 / 25 = 0.2.",
            },
            {
              text: "Dans un sac de billes (10 bleues, 5 rouges), quelle est la probabilité de tirer une bille jaune ?",
              type: "text",
              accepted: ["0"],
              solution:
                "Il n'y a pas de bille jaune, l'événement est impossible.",
            },
            {
              text: "Si on multiplie toutes les probabilités des branches d'un arbre menant à une issue, on obtient :",
              type: "mcq",
              options: ["La probabilité de l'issue finale", "L'univers", "1"],
              correct: 0,
              solution: "C'est la règle de multiplication des chemins.",
            },
            {
              text: "Si une pièce est truquée et donne Pile 7 fois sur 10, P(Face) = ?",
              type: "text",
              accepted: ["3/10", "0.3"],
              solution: "1 - 0.7 = 0.3.",
            },
            {
              text: "Vrai ou Faux : P(A U B) = P(A) + P(B) est toujours vrai.",
              type: "mcq",
              options: ["Vrai", "Faux"],
              correct: 1,
              solution:
                "Ce n'est vrai que si les événements sont incompatibles.",
            },
          ],
        },
      ];

      const app = {
        state: {
          catIdx: 0,
          qIdx: 0,
        },

        init: function () {
          this.renderMenu();
        },

        renderMenu: function () {
          const nav = document.getElementById("nav-container");
          nav.innerHTML = "";
          document.getElementById("quiz-ui").classList.add("hidden");
          document.getElementById("nav-container").classList.remove("hidden");

          db.forEach((cat, idx) => {
            const btn = document.createElement("div");
            btn.className = "nav-btn";
            btn.textContent = cat.category;
            btn.onclick = () => this.startCategory(idx);
            nav.appendChild(btn);
          });
        },

        startCategory: function (idx) {
          this.state.catIdx = idx;
          this.state.qIdx = 0;

          document.getElementById("nav-container").classList.add("hidden");
          document.getElementById("quiz-ui").classList.remove("hidden");
          this.renderQuestion();
        },

        renderQuestion: function () {
          const q = db[this.state.catIdx].questions[this.state.qIdx];
          const card = document.getElementById("question-card-container");
          const feedback = document.getElementById("feedback-area");
          const btn = document.getElementById("main-btn");

          card.classList.remove("fast-exit", "entering");
          void card.offsetWidth;
          card.classList.add("entering");

          feedback.className = "";
          feedback.classList.remove("visible");
          feedback.style.display = "none";

          btn.textContent = "Valider la réponse";
          btn.disabled = false;
          btn.style.backgroundColor = "#4c51bf";

          document.getElementById("cat-label").textContent =
            db[this.state.catIdx].category;
          document.getElementById("counter-label").textContent =
            `${this.state.qIdx + 1} / ${db[this.state.catIdx].questions.length}`;
          document.getElementById("question-text").innerHTML = q.text;

          const imgArea = document.getElementById("image-area");
          if (q.image) {
            imgArea.innerHTML = `<img src="${q.image}">`;
            imgArea.classList.remove("hidden");
          } else {
            imgArea.classList.add("hidden");
          }

          const pct =
            (this.state.qIdx / db[this.state.catIdx].questions.length) * 100;
          document.getElementById("progress-fill").style.width = pct + "%";

          const inputArea = document.getElementById("input-area");
          inputArea.innerHTML = "";

          if (q.type === "mcq") {
            const container = document.createElement("div");
            container.className = "options-container";

            let mixedOptions = q.options.map((optText, originalIndex) => {
              return { text: optText, val: originalIndex };
            });

            mixedOptions.sort(() => Math.random() - 0.5);

            mixedOptions.forEach((optObj, i) => {
              const item = document.createElement("div");
              item.className = "option-item";
              item.innerHTML = `
                        <input type="radio" name="quiz-opt" id="opt-${i}" value="${optObj.val}">
                        <label class="answer-btn" for="opt-${i}">${optObj.text}</label>
                    `;
              container.appendChild(item);
            });
            inputArea.appendChild(container);
          } else {
            inputArea.innerHTML = `<input type="text" id="text-answer" class="text-input-styled" placeholder="Ta réponse..." autocomplete="off">`;
            document
              .getElementById("text-answer")
              .addEventListener("keypress", (e) => {
                if (e.key === "Enter") this.checkAnswer();
              });
            setTimeout(
              () => document.getElementById("text-answer").focus(),
              100,
            );
          }
        },

        checkAnswer: function () {
          const q = db[this.state.catIdx].questions[this.state.qIdx];
          const feedback = document.getElementById("feedback-area");
          feedback.style.display = "block";
          const btn = document.getElementById("main-btn");
          let isCorrect = false;
          let userElement = null;

          if (q.type === "mcq") {
            const selected = document.querySelector(
              'input[name="quiz-opt"]:checked',
            );
            if (!selected) return alert("Choisis une réponse !");

            const label = document.querySelector(`label[for="${selected.id}"]`);
            userElement = label;

            if (parseInt(selected.value) === q.correct) {
              isCorrect = true;
            }
          } else {
            const input = document.getElementById("text-answer");
            if (!input.value.trim()) return alert("Écris une réponse !");
            userElement = input;

            const val = input.value
              .toLowerCase()
              .replace(/\s/g, "")
              .replace(",", ".");
            const accepted = q.accepted.map((a) =>
              a.toLowerCase().replace(/\s/g, "").replace(",", "."),
            );
            if (accepted.includes(val)) isCorrect = true;
          }

          btn.disabled = true;

          if (isCorrect) {
            userElement.classList.add("correct");
            feedback.className = "feedback-correct visible";
            feedback.innerHTML = `
                    <div style="font-size: 1.2em; margin-bottom: 5px;">✅ <span class="couleur-qui-change">Excellent !</span></div>
                    <div>${q.solution}</div>
                `;
            btn.style.backgroundColor = "#48bb78";
            btn.textContent = "Bravo !";
          } else {
            userElement.classList.add("incorrect");

            if (q.type === "mcq") {
              const correctInput = document.querySelector(
                `input[name="quiz-opt"][value="${q.correct}"]`,
              );
              if (correctInput) {
                const correctLabel = document.querySelector(
                  `label[for="${correctInput.id}"]`,
                );
                correctLabel.classList.add("correct");
              }
            }

            feedback.className = "feedback-incorrect visible";
            feedback.innerHTML = `
                    <div style="font-size: 1.2em; margin-bottom: 5px;">❌ Aïe... Regarde la correction :</div>
                    <div><strong>${q.solution}</strong></div>
                `;
            btn.style.backgroundColor = "#c53030";
            btn.textContent = "Lecture correction...";
          }

          const pct =
            ((this.state.qIdx + 1) / db[this.state.catIdx].questions.length) *
            100;
          document.getElementById("progress-fill").style.width = pct + "%";

          const delayDuration = isCorrect ? 1200 : 4000;

          setTimeout(() => {
            this.handleTransition();
          }, delayDuration);
        },

        handleTransition: function () {
          if (this.state.qIdx >= db[this.state.catIdx].questions.length - 1) {
            alert("Série terminée ! Retour au menu.");
            this.renderMenu();
            return;
          }

          const card = document.getElementById("question-card-container");
          card.classList.remove("entering");
          card.classList.add("fast-exit");

          setTimeout(() => {
            this.state.qIdx++;
            this.renderQuestion();
          }, 300);
        },
      };

      window.onload = () => app.init();
    </script>
  
    

    <!-- BOUTON RETOUR PWA -->
    <script>
      (function() {
        const checkAndAddButton = () => {
          const isPWA = window.matchMedia('(display-mode: standalone)').matches || 
                        window.matchMedia('(display-mode: fullscreen)').matches || 
                        navigator.standalone;
          
          if (isPWA && !window.location.pathname.endsWith('index.html')) {
            const btn = document.createElement('button');
            btn.innerHTML = '← Retour';
            btn.style.position = 'fixed';
            btn.style.top = '15px';
            btn.style.left = '15px';
            btn.style.zIndex = '9999';
            btn.style.background = '#4CAF50';
            btn.style.color = 'white';
            btn.style.border = 'none';
            btn.style.padding = '10px 20px';
            btn.style.borderRadius = '8px';
            btn.style.cursor = 'pointer';
            btn.style.boxShadow = '0 4px 10px rgba(0,0,0,0.5)';
            btn.style.fontWeight = 'bold';
            btn.style.fontFamily = 'Arial, sans-serif';
            btn.style.fontSize = '16px';
            btn.style.transition = 'background 0.3s, transform 0.3s';
            
            btn.onmouseover = () => {
                btn.style.background = '#45a049';
                btn.style.transform = 'scale(1.05)';
            };
            btn.onmouseout = () => {
                btn.style.background = '#4CAF50';
                btn.style.transform = 'scale(1)';
            };
            
            btn.onclick = () => {
               window.location.href = '../index.html';
            };
            
            document.body.appendChild(btn);
          }
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkAndAddButton);
        } else {
          checkAndAddButton();
        }
      })();
    </script>
</body>
