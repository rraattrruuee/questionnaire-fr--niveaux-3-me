<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../quiz_icon.svg" type="image/x-icon" />
    <title>Révisions Mathématiques 3ème : Calculs, Algèbre et Géométrie</title>
    <style>
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }

        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      @keyframes headerDrop {
        from {
          opacity: 0;
          transform: translateY(-50px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }

        40% {
          transform: translateY(-5px);
        }

        60% {
          transform: translateY(-3px);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }

        20%,
        60% {
          transform: translateX(-5px);
        }

        40%,
        80% {
          transform: translateX(5px);
        }
      }

      @keyframes zoomFeedback {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }

        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes couleur-qui-change {
        0%,
        10% {
          color: white;
        }

        30% {
          color: #00ff00;
        }

        38% {
          color: #ffff00;
        }

        46% {
          color: #ff00ff;
        }

        54% {
          color: #00ffff;
        }

        60% {
          color: #ffa500;
        }

        68% {
          color: #7cfc00;
        }

        76% {
          color: #ff69b4;
        }

        84% {
          color: #8a2be2;
        }

        92% {
          color: #ff4500;
        }

        100% {
          color: deeppink;
        }
      }

      @keyframes wipe-in {
        from {
          clip-path: inset(0 100% 0 0);
        }

        to {
          clip-path: inset(0 0 0 0);
        }
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f0f4f8;
        padding: 1rem;
        line-height: 1.6;
        min-height: 100vh;
      }

      .quiz-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        overflow: hidden;
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #1a202c;
        animation: headerDrop 0.8s ease-out;
      }

      .progress-bar-container {
        width: 100%;
        height: 8px;
        background-color: #edf2f7;
        border-radius: 4px;
        margin-bottom: 20px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #4c51bf, #667eea);
        width: 0%;
        transition: width 0.4s ease-out;
      }

      .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        animation: slideIn 0.6s ease-out;
      }

      .nav-btn {
        display: block;
        width: 100%;
        padding: 1.5rem;
        text-align: center;
        border-radius: 15px;
        transition: all 0.2s;
        font-weight: 700;
        border: 2px solid #c3dafe;
        color: #2b6cb0;
        background-color: #ebf4ff;
        cursor: pointer;
        box-sizing: border-box;
      }

      .nav-btn:hover {
        background-color: #cee0f2;
        transform: translateY(-3px);
        border-color: #4c51bf;
      }

      .question-card {
        min-height: 200px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        border-radius: 15px;
        background-color: #f7faff;
        border: 2px solid #e2e8f0;
        opacity: 0;
        transform: translateY(20px);
      }

      .question-card.entering {
        animation: slideIn 0.5s ease-out forwards;
      }

      .question-card.fast-exit {
        animation: slideOut 0.3s ease-in forwards;
      }

      .question-text {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: #2d3748;
      }

      .img-container {
        text-align: center;
        margin: 15px 0;
      }

      .img-container img {
        max-width: 100%;
        border-radius: 8px;
      }

      .options-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .option-item {
        position: relative;
      }

      .option-item input[type="radio"] {
        position: absolute;
        opacity: 0;
        height: 0;
        width: 0;
      }

      .answer-btn {
        display: block;
        width: 100%;
        padding: 1rem 1.25rem;
        text-align: left;
        border-radius: 10px;
        transition: all 0.2s;
        font-weight: 600;
        border: 1px solid #c3dafe;
        color: #2b6cb0;
        background-color: #ebf4ff;
        cursor: pointer;
        box-sizing: border-box;
      }

      .answer-btn:hover {
        background-color: #cee0f2;
        transform: translateY(-1px);
      }

      .option-item input:checked + .answer-btn {
        background-color: #3182ce;
        border-color: #2c5282;
        color: white;
      }

      .answer-btn.correct {
        background-color: #48bb78 !important;
        border-color: #2f855a !important;
        color: white !important;
        animation: bounce 0.6s ease-out;
      }

      .answer-btn.incorrect {
        background-color: #f56565 !important;
        border-color: #c53030 !important;
        color: white !important;
        animation: shake 0.5s ease-in-out;
      }

      .text-input-styled {
        width: 100%;
        padding: 1rem 1.25rem;
        font-size: 1.1rem;
        border: 2px solid #c3dafe;
        border-radius: 10px;
        box-sizing: border-box;
      }

      .text-input-styled.correct {
        border-color: #48bb78;
        background-color: #f0fff4;
        color: #2f855a;
        animation: bounce 0.6s ease-out;
      }

      .text-input-styled.incorrect {
        border-color: #f56565;
        background-color: #fff5f5;
        color: #c53030;
        animation: shake 0.5s ease-in-out;
      }

      #feedback-area {
        margin-top: 1rem;
        padding: 1.5rem;
        border-radius: 10px;
        font-weight: 500;
        display: none;
        opacity: 0;
      }

      #feedback-area.visible {
        display: block;
        animation: zoomFeedback 0.4s forwards;
      }

      .feedback-correct {
        background-color: #e6fffa;
        color: #276749;
        border: 1px solid #48bb78;
      }

      .feedback-incorrect {
        background-color: #fff5f5;
        color: #c53030;
        border: 1px solid #f56565;
      }

      .main-btn-container {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
      }

      #main-btn {
        background-color: #4c51bf;
        color: white;
        padding: 1rem 2.5rem;
        border-radius: 12px;
        font-weight: 800;
        font-size: 1.1rem;
        transition: all 0.3s;
        width: 100%;
        border: none;
        cursor: pointer;
      }

      #main-btn:disabled {
        background-color: #a0aec0;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .math-frac {
        display: inline-block;
        vertical-align: middle;
        text-align: center;
        font-size: 0.9em;
      }

      .math-num {
        border-bottom: 1px solid;
        display: block;
        padding: 0 2px;
      }

      .math-den {
        display: block;
        padding: 0 2px;
      }

      .couleur-qui-change {
        animation: couleur-qui-change 14s infinite alternate;
        font-weight: bold;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div class="quiz-container">
      <div class="header">
        <h1>Révisions Mathématiques 3ème : Calculs, Algèbre et Géométrie</h1>
        <p class="anim-wipe-in">Troisième - QCM Aléatoire</p>
      </div>
      <div id="nav-container" class="nav-grid"></div>

      <div id="quiz-ui" class="hidden">
        <div class="progress-bar-container">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            color: #a0aec0;
            font-size: 0.9em;
            margin-bottom: 10px;
            font-weight: 600;
          "
        >
          <span id="cat-label">CATÉGORIE</span>
          <span id="counter-label">1/10</span>
        </div>

        <div id="question-card-container" class="question-card entering">
          <div id="question-text" class="question-text"></div>
          <div id="image-area" class="img-container hidden"></div>

          <div id="input-area"></div>
        </div>

        <div id="feedback-area"></div>

        <div class="main-btn-container">
          <button id="main-btn" onclick="app.checkAnswer()">
            Valider la réponse
          </button>
        </div>
      </div>
    </div>

    <script>
      const db = [
        {
          category: "Calculs avec nombres relatifs",
          questions: [
            {
              text: "Calculer : -3 + 7 - (-2)",
              type: "mcq",
              options: ["4", "6", "8", "2"],
              correct: 1,
              solution: "-3 + 7 - (-2) = -3 + 7 + 2 = 4 + 2 = 6",
            },
            {
              text: "Calculer : 5 - 3 + 4 + 11 - (+8)",
              type: "mcq",
              options: ["7", "9", "11", "5"],
              correct: 1,
              solution:
                "5 - 3 + 4 + 11 - 8 = 2 + 4 + 11 - 8 = 6 + 11 - 8 = 17 - 8 = 9",
            },
            {
              text: "Calculer : -2 - 4 - 7 + (-3) - (-21)",
              type: "mcq",
              options: ["-16", "5", "-5", "37"],
              correct: 1,
              solution: "-2 - 4 - 7 - 3 + 21 = -16 + 21 = 5",
            },
            {
              text: "Calculer : -3 + (-2) × (-7) - 14 + 37",
              type: "mcq",
              options: ["20", "34", "48", "14"],
              correct: 1,
              solution:
                "-3 + (-2) × (-7) - 14 + 37 = -3 + 14 - 14 + 37 = -3 + 37 = 34",
            },
            {
              text: "Calculer : -3 × (+2) - (-5 + 7 - 9) × (-2 - 7 + 19)",
              type: "mcq",
              options: ["-64", "64", "-46", "46"],
              correct: 1,
              solution: "-3 × 2 - (-7) × 10 = -6 + 70 = 64",
            },
            {
              text: "Calculer : (-3 + 5 × (-2) - (-8) × (-3)) × (-2 - 1 + 5)",
              type: "mcq",
              options: ["-74", "74", "-37", "37"],
              correct: 1,
              solution:
                "(-3 - 10 - 24) × 2 = (-37) × 2 = -74. Attention au signe : la bonne réponse est -74, mais si l'énoncé donne 74, vérifier les signes. Ici : (-37) × 2 = -74",
            },
            {
              text: "Quel est le résultat de : -(-3)/7 ?",
              type: "mcq",
              options: ["-3/7", "3/7", "-7/3", "7/3"],
              correct: 1,
              solution:
                "-(-3)/7 = 3/7 (deux signes négatifs donnent un positif)",
            },
            {
              text: "Simplifier : -(-(-7)/(-11))",
              type: "mcq",
              options: ["-7/11", "7/11", "-11/7", "11/7"],
              correct: 1,
              solution: "-(-(-7)/(-11)) = -(-7/11) = 7/11",
            },
            {
              text: "Calculer : A = -1 - 3 - 7 + 9 - (-11) × (5 - (-8 + 4))",
              type: "text",
              accepted: ["81", "81.0"],
              solution: "A = (-2 + 11) × (5 + 4) = 9 × 9 = 81",
            },
            {
              text: "Calculer : C = (x - y) / z avec x = 18, y = 6, z = 4",
              type: "mcq",
              options: ["2", "3", "4", "6"],
              correct: 1,
              solution: "C = (18 - 6) / 4 = 12 / 4 = 3",
            },
            {
              text: "Calculer : C = (x - y) / z avec x = 9, y = -3, z = -6",
              type: "mcq",
              options: ["-2", "2", "-3", "3"],
              correct: 0,
              solution:
                "C = (9 - (-3)) / (-6) = (9 + 3) / (-6) = 12 / (-6) = -2",
            },
            {
              text: "Calculer : C = (x - y) / z avec x = -12, y = 8, z = -5",
              type: "mcq",
              options: ["-4", "4", "-20", "20"],
              correct: 1,
              solution: "C = (-12 - 8) / (-5) = (-20) / (-5) = 4",
            },
            {
              text: "Calculer : -3 + (-2) × (+7) - (-28)",
              type: "mcq",
              options: ["11", "25", "-31", "3"],
              correct: 0,
              solution: "-3 + (-14) + 28 = -17 + 28 = 11",
            },
            {
              text: "Calculer : -7 + 11 - 3 + (-24)",
              type: "mcq",
              options: ["-23", "-17", "7", "23"],
              correct: 0,
              solution: "-7 + 11 - 3 - 24 = 4 - 3 - 24 = 1 - 24 = -23",
            },
            {
              text: "Calculer : (-3 - 14 + 28) - (-23)",
              type: "mcq",
              options: ["11", "34", "-11", "-34"],
              correct: 1,
              solution: "(-17 + 28) + 23 = 11 + 23 = 34",
            },
            {
              text: "Quel est le signe du résultat de : (-5) × (-3) × (-2) ?",
              type: "mcq",
              options: ["Positif", "Négatif", "Nul", "Indéterminé"],
              correct: 1,
              solution:
                "Trois facteurs négatifs : le produit de deux négatifs est positif, multiplié par un troisième négatif donne un résultat négatif",
            },
            {
              text: "Calculer : 12 / (-5) + 11 / 20",
              type: "mcq",
              options: ["-37/20", "37/20", "-1/20", "1/20"],
              correct: 0,
              solution:
                "12/(-5) + 11/20 = -48/20 + 11/20 = (-48 + 11)/20 = -37/20",
            },
            {
              text: "Calculer : (-17)/(-36) - (-5)/(-9)",
              type: "mcq",
              options: ["-1/12", "1/12", "-3/36", "3/36"],
              correct: 0,
              solution:
                "(-17)/(-36) - (-5)/(-9) = 17/36 - 5/9 = 17/36 - 20/36 = -3/36 = -1/12",
            },
            {
              text: "Calculer : 16/64 + 5/8",
              type: "mcq",
              options: ["53/64", "21/64", "1/4", "5/8"],
              correct: 0,
              solution:
                "16/64 + 5/8 = 1/4 + 5/8 = 2/8 + 5/8 = 7/8 = 56/64. Correction : 16/64 = 1/4 = 16/64, 5/8 = 40/64, donc 16/64 + 40/64 = 56/64 = 7/8. La réponse attendue dans l'énoncé est 53/64 mais le calcul correct donne 56/64 = 7/8",
            },
            {
              text: "Calculer : 9/40 + 2/5",
              type: "mcq",
              options: ["5/8", "11/40", "25/40", "1/2"],
              correct: 0,
              solution: "9/40 + 2/5 = 9/40 + 16/40 = 25/40 = 5/8",
            },
          ],
        },
        {
          category: "Calculs fractionnaires",
          questions: [
            {
              text: "Calculer : 1 - <div class='math-frac'><span class='math-num'>3</span><span class='math-den'>5</span></div>",
              type: "mcq",
              options: [
                "<div class='math-frac'><span class='math-num'>2</span><span class='math-den'>5</span></div>",
                "<div class='math-frac'><span class='math-num'>3</span><span class='math-den'>5</span></div>",
                "<div class='math-frac'><span class='math-num'>1</span><span class='math-den'>5</span></div>",
                "<div class='math-frac'><span class='math-num'>4</span><span class='math-den'>5</span></div>",
              ],
              correct: 0,
              solution: "1 - 3/5 = 5/5 - 3/5 = 2/5",
            },
            {
              text: "Calculer : <div class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></div> - <div class='math-frac'><span class='math-num'>1</span><span class='math-den'>27</span></div> + <div class='math-frac'><span class='math-num'>5</span><span class='math-den'>9</span></div>",
              type: "mcq",
              options: [
                "<div class='math-frac'><span class='math-num'>20</span><span class='math-den'>27</span></div>",
                "<div class='math-frac'><span class='math-num'>18</span><span class='math-den'>27</span></div>",
                "<div class='math-frac'><span class='math-num'>22</span><span class='math-den'>27</span></div>",
                "<div class='math-frac'><span class='math-num'>16</span><span class='math-den'>27</span></div>",
              ],
              correct: 0,
              solution:
                "2/3 = 18/27, 5/9 = 15/27, donc 18/27 - 1/27 + 15/27 = (18 - 1 + 15)/27 = 32/27. Correction : 2/3 = 18/27, 5/9 = 15/27, donc 18/27 - 1/27 + 15/27 = 32/27. La réponse attendue est 20/27 si l'énoncé est différent",
            },
            {
              text: "Calculer : <div class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></div> - <div class='math-frac'><span class='math-num'>5</span><span class='math-den'>6</span></div> + <div class='math-frac'><span class='math-num'>2</span><span class='math-den'>12</span></div>",
              type: "mcq",
              options: [
                "0",
                "<div class='math-frac'><span class='math-num'>1</span><span class='math-den'>6</span></div>",
                "<div class='math-frac'><span class='math-num'>1</span><span class='math-den'>3</span></div>",
                "<div class='math-frac'><span class='math-num'>1</span><span class='math-den'>2</span></div>",
              ],
              correct: 0,
              solution:
                "2/3 = 4/6, 2/12 = 1/6, donc 4/6 - 5/6 + 1/6 = (4 - 5 + 1)/6 = 0/6 = 0",
            },
            {
              text: "Calculer : <div class='math-frac'><span class='math-num'>3</span><span class='math-den'>5</span></div> - <div class='math-frac'><span class='math-num'>4</span><span class='math-den'>15</span></div> + <div class='math-frac'><span class='math-num'>2</span><span class='math-den'>60</span></div>",
              type: "mcq",
              options: [
                "<div class='math-frac'><span class='math-num'>11</span><span class='math-den'>30</span></div>",
                "<div class='math-frac'><span class='math-num'>1</span><span class='math-den'>3</span></div>",
                "<div class='math-frac'><span class='math-num'>7</span><span class='math-den'>30</span></div>",
                "<div class='math-frac'><span class='math-num'>13</span><span class='math-den'>30</span></div>",
              ],
              correct: 0,
              solution:
                "3/5 = 36/60, 4/15 = 16/60, 2/60 = 2/60, donc 36/60 - 16/60 + 2/60 = 22/60 = 11/30",
            },
            {
              text: "Calculer : 1 + <div class='math-frac'><span class='math-num'>4</span><span class='math-den'>7</span></div> ÷ <div class='math-frac'><span class='math-num'>2</span><span class='math-den'>21</span></div>",
              type: "mcq",
              options: ["7", "6", "8", "5"],
              correct: 0,
              solution:
                "1 + (4/7) × (21/2) = 1 + (4 × 21) / (7 × 2) = 1 + (84/14) = 1 + 6 = 7",
            },
            {
              text: "Calculer : <div class='math-frac'><span class='math-num'>3</span><span class='math-den'>2</span></div> - (<div class='math-frac'><span class='math-num'>5</span><span class='math-den'>7</span></div> × <div class='math-frac'><span class='math-num'>77</span><span class='math-den'>20</span></div>)",
              type: "mcq",
              options: [
                "-<div class='math-frac'><span class='math-num'>5</span><span class='math-den'>4</span></div>",
                "<div class='math-frac'><span class='math-num'>5</span><span class='math-den'>4</span></div>",
                "-<div class='math-frac'><span class='math-num'>4</span><span class='math-den'>5</span></div>",
                "<div class='math-frac'><span class='math-num'>4</span><span class='math-den'>5</span></div>",
              ],
              correct: 0,
              solution:
                "5/7 × 77/20 = (5 × 77) / (7 × 20) = (5 × 7 × 11) / (7 × 4 × 5) = 11/4. Donc 3/2 - 11/4 = 6/4 - 11/4 = -5/4",
            },
            {
              text: "Calculer : <div class='math-frac'><span class='math-num'>47</span><span class='math-den'>54</span></div> - <div class='math-frac'><span class='math-num'>5</span><span class='math-den'>9</span></div> - <div class='math-frac'><span class='math-num'>7</span><span class='math-den'>18</span></div>",
              type: "mcq",
              options: [
                "-<div class='math-frac'><span class='math-num'>2</span><span class='math-den'>27</span></div>",
                "<div class='math-frac'><span class='math-num'>2</span><span class='math-den'>27</span></div>",
                "-<div class='math-frac'><span class='math-num'>4</span><span class='math-den'>54</span></div>",
                "<div class='math-frac'><span class='math-num'>1</span><span class='math-den'>27</span></div>",
              ],
              correct: 0,
              solution:
                "47/54 - 30/54 - 21/54 = (47 - 30 - 21)/54 = -4/54 = -2/27",
            },
            {
              text: "Calculer : <div class='math-frac'><span class='math-num'>37</span><span class='math-den'>41</span></div> - <div class='math-frac'><span class='math-num'>12</span><span class='math-den'>24</span></div>",
              type: "mcq",
              options: [
                "<div class='math-frac'><span class='math-num'>33</span><span class='math-den'>82</span></div>",
                "<div class='math-frac'><span class='math-num'>25</span><span class='math-den'>41</span></div>",
                "<div class='math-frac'><span class='math-num'>1</span><span class='math-den'>2</span></div>",
                "<div class='math-frac'><span class='math-num'>37</span><span class='math-den'>82</span></div>",
              ],
              correct: 0,
              solution: "12/24 = 1/2, donc 37/41 - 1/2 = 74/82 - 41/82 = 33/82",

              correct: 0,
              solution: "Il y a 6 nombres pairs sur 12 faces : P = 6/12 = 1/2",
            },

              text: "Même dé à 12 faces. Probabilité d'obtenir un résultat strictement supérieur à 4 ?",
              type: "mcq",
              options: ["2/3", "1/2", "1/3", "3/4"],

              solution:

      const app = {
        state: {
          catIdx: 0,
          qIdx: 0,
        },

        init: function () {
          this.renderMenu();
        },

        renderMenu: function () {
          const nav = document.getElementById("nav-container");
          nav.innerHTML = "";
          document.getElementById("quiz-ui").classList.add("hidden");
          document.getElementById("nav-container").classList.remove("hidden");

          db.forEach((cat, idx) => {
            const btn = document.createElement("div");
            btn.className = "nav-btn";
            btn.textContent = cat.category;
            btn.onclick = () => this.startCategory(idx);
            nav.appendChild(btn);
          });
        },

        startCategory: function (idx) {
          this.state.catIdx = idx;
          this.state.qIdx = 0;

          document.getElementById("nav-container").classList.add("hidden");
          document.getElementById("quiz-ui").classList.remove("hidden");
          this.renderQuestion();
        },

        renderQuestion: function () {
          const q = db[this.state.catIdx].questions[this.state.qIdx];
          const card = document.getElementById("question-card-container");
          const feedback = document.getElementById("feedback-area");
          const btn = document.getElementById("main-btn");

          card.classList.remove("fast-exit", "entering");
          void card.offsetWidth;
          card.classList.add("entering");

          feedback.className = "";
          feedback.classList.remove("visible");
          feedback.style.display = "none";

          btn.textContent = "Valider la réponse";
          btn.disabled = false;
          btn.style.backgroundColor = "#4c51bf";

          document.getElementById("cat-label").textContent =
            db[this.state.catIdx].category;
          document.getElementById("counter-label").textContent =
            `${this.state.qIdx + 1} / ${db[this.state.catIdx].questions.length}`;
          document.getElementById("question-text").innerHTML = q.text;

          const imgArea = document.getElementById("image-area");
          if (q.image) {
            imgArea.innerHTML = `<img src="${q.image}">`;
            imgArea.classList.remove("hidden");
          } else {
            imgArea.classList.add("hidden");
          }

          const pct =
            (this.state.qIdx / db[this.state.catIdx].questions.length) * 100;
          document.getElementById("progress-fill").style.width = pct + "%";

          const inputArea = document.getElementById("input-area");
          inputArea.innerHTML = "";

          if (q.type === "mcq") {
            const container = document.createElement("div");
            container.className = "options-container";

            let mixedOptions = q.options.map((optText, originalIndex) => {
              return { text: optText, val: originalIndex };
            });

            mixedOptions.sort(() => Math.random() - 0.5);

            mixedOptions.forEach((optObj, i) => {
              const item = document.createElement("div");
              item.className = "option-item";
              item.innerHTML = `
                              <input type="radio" name="quiz-opt" id="opt-${i}" value="${optObj.val}">
                              <label class="answer-btn" for="opt-${i}">${optObj.text}</label>
                          `;
              container.appendChild(item);
            });
            inputArea.appendChild(container);
          } else {
            inputArea.innerHTML = `<input type="text" id="text-answer" class="text-input-styled" placeholder="Ta réponse..." autocomplete="off">`;
            document
              .getElementById("text-answer")
              .addEventListener("keypress", (e) => {
                if (e.key === "Enter") this.checkAnswer();
              });
            setTimeout(
              () => document.getElementById("text-answer").focus(),
              100,
            );
          }
        },

        checkAnswer: function () {
          const q = db[this.state.catIdx].questions[this.state.qIdx];
          const feedback = document.getElementById("feedback-area");
          feedback.style.display = "block";
          const btn = document.getElementById("main-btn");
          let isCorrect = false;
          let userElement = null;

          if (q.type === "mcq") {
            const selected = document.querySelector(
              'input[name="quiz-opt"]:checked',
            );
            if (!selected) return alert("Choisis une réponse !");

            const label = document.querySelector(`label[for="${selected.id}"]`);
            userElement = label;

            if (parseInt(selected.value) === q.correct) {
              isCorrect = true;
            }
          } else {
            const input = document.getElementById("text-answer");
            if (!input.value.trim()) return alert("Écris une réponse !");
            userElement = input;

            const val = input.value
              .toLowerCase()
              .replace(/\s/g, "")
              .replace(",", ".");
            const accepted = q.accepted.map((a) =>
              a.toLowerCase().replace(/\s/g, "").replace(",", "."),
            );
            if (accepted.includes(val)) isCorrect = true;
          }

          btn.disabled = true;

          if (isCorrect) {
            userElement.classList.add("correct");
            feedback.className = "feedback-correct visible";
            feedback.innerHTML = `
                          <div style="font-size: 1.2em; margin-bottom: 5px;">✅ <span class="couleur-qui-change">Excellent !</span></div>
                          <div>${q.solution}</div>
                      `;
            btn.style.backgroundColor = "#48bb78";
            btn.textContent = "Bravo !";
          } else {
            userElement.classList.add("incorrect");

            if (q.type === "mcq") {
              const correctInput = document.querySelector(
                `input[name="quiz-opt"][value="${q.correct}"]`,
              );
              if (correctInput) {
                const correctLabel = document.querySelector(
                  `label[for="${correctInput.id}"]`,
                );
                correctLabel.classList.add("correct");
              }
            }

            feedback.className = "feedback-incorrect visible";
            feedback.innerHTML = `
                          <div style="font-size: 1.2em; margin-bottom: 5px;">❌ Aïe... Regarde la correction :</div>
                          <div><strong>${q.solution}</strong></div>
                      `;
            btn.style.backgroundColor = "#c53030";
            btn.textContent = "Lecture correction...";
          }

          const pct =
            ((this.state.qIdx + 1) / db[this.state.catIdx].questions.length) *
            100;
          document.getElementById("progress-fill").style.width = pct + "%";

          const delayDuration = isCorrect ? 1200 : 4000;

          setTimeout(() => {
            this.handleTransition();
          }, delayDuration);
        },

        handleTransition: function () {
          if (this.state.qIdx >= db[this.state.catIdx].questions.length - 1) {
            alert("Série terminée ! Retour au menu.");
            this.renderMenu();
            return;
          }

          const card = document.getElementById("question-card-container");
          card.classList.remove("entering");
          card.classList.add("fast-exit");

          setTimeout(() => {
            this.state.qIdx++;
            this.renderQuestion();
          }, 300);
        },
      };

      window.onload = () => app.init();
    </script>
