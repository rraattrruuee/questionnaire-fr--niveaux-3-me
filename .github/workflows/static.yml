name: Update Assets and Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.json"
      - "generate-sw.sh"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (optional environment)
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Update Service Worker
        run: |
          chmod +x generate-sw.sh
          ./generate-sw.sh
          rm -f service-worker.js.tmp

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # On indexe spécifiquement le fichier généré
          git add service-worker.js

          # On vérifie s'il y a une différence réelle par rapport au dépôt
          if git diff --cached --quiet; then
            echo "✅ Le service-worker.js est déjà à jour."
          else
            echo "🚀 Nouveaux fichiers détectés, mise à jour du dépôt..."
            git commit -m "chore: mise à jour automatique des assets (PWA) [skip ci]"
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
