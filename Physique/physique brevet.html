<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="../quiz_icon.svg" type="image/x-icon" />
        <title>Révisions Français 3ème : Grammaire et Expression</title>
        <style>
            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes slideOut {
                from {
                    opacity: 1;
                    transform: translateY(0);
                }

                to {
                    opacity: 0;
                    transform: translateY(-10px);
                }
            }

            @keyframes headerDrop {
                from {
                    opacity: 0;
                    transform: translateY(-50px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes bounce {
                0%,
                20%,
                50%,
                80%,
                100% {
                    transform: translateY(0);
                }

                40% {
                    transform: translateY(-5px);
                }

                60% {
                    transform: translateY(-3px);
                }
            }

            @keyframes shake {
                0%,
                100% {
                    transform: translateX(0);
                }

                20%,
                60% {
                    transform: translateX(-5px);
                }

                40%,
                80% {
                    transform: translateX(5px);
                }
            }

            @keyframes zoomFeedback {
                0% {
                    transform: scale(0.9);
                    opacity: 0;
                }

                100% {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            @keyframes couleur-qui-change {
                0%,
                10% {
                    color: white;
                }

                30% {
                    color: #00ff00;
                }

                38% {
                    color: #ffff00;
                }

                46% {
                    color: #ff00ff;
                }

                54% {
                    color: #00ffff;
                }

                60% {
                    color: #ffa500;
                }

                68% {
                    color: #7cfc00;
                }

                76% {
                    color: #ff69b4;
                }

                84% {
                    color: #8a2be2;
                }

                92% {
                    color: #ff4500;
                }

                100% {
                    color: deeppink;
                }
            }

            @keyframes wipe-in {
                from {
                    clip-path: inset(0 100% 0 0);
                }

                to {
                    clip-path: inset(0 0 0 0);
                }
            }

            .anim-wipe-in {
                animation: wipe-in 1s ease-out;
            }

            body {
                font-family: "Segoe UI", Arial, sans-serif;
                background-color: #f0f4f8;
                padding: 1rem;
                line-height: 1.6;
                min-height: 100vh;
            }

            .quiz-container {
                max-width: 800px;
                margin: 2rem auto;
                padding: 2rem;
                background: #ffffff;
                border-radius: 20px;
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
                overflow: hidden;
            }

            .header {
                text-align: center;
                margin-bottom: 2rem;
            }

            .header h1 {
                font-size: 2rem;
                font-weight: 700;
                color: #1a202c;
                animation: headerDrop 0.8s ease-out;
            }

            .progress-bar-container {
                width: 100%;
                height: 8px;
                background-color: #edf2f7;
                border-radius: 4px;
                margin-bottom: 20px;
                overflow: hidden;
            }

            .progress-bar-fill {
                height: 100%;
                background: linear-gradient(90deg, #4c51bf, #667eea);
                width: 0%;
                transition: width 0.4s ease-out;
            }

            .nav-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 15px;
                animation: slideIn 0.6s ease-out;
            }

            .nav-btn {
                display: block;
                width: 100%;
                padding: 1.5rem;
                text-align: center;
                border-radius: 15px;
                transition: all 0.2s;
                font-weight: 700;
                border: 2px solid #c3dafe;
                color: #2b6cb0;
                background-color: #ebf4ff;
                cursor: pointer;
                box-sizing: border-box;
            }

            .nav-btn:hover {
                background-color: #cee0f2;
                transform: translateY(-3px);
                border-color: #4c51bf;
            }

            .question-card {
                min-height: 200px;
                padding: 2rem;
                margin-bottom: 1.5rem;
                border-radius: 15px;
                background-color: #f7faff;
                border: 2px solid #e2e8f0;
                opacity: 0;
                transform: translateY(20px);
            }

            .question-card.entering {
                animation: slideIn 0.5s ease-out forwards;
            }

            .question-card.fast-exit {
                animation: slideOut 0.3s ease-in forwards;
            }

            .question-text {
                font-size: 1.3rem;
                font-weight: 700;
                margin-bottom: 1.5rem;
                color: #2d3748;
            }

            .img-container {
                text-align: center;
                margin: 15px 0;
            }

            .img-container img {
                max-width: 100%;
                border-radius: 8px;
            }

            .options-container {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
            }

            .option-item {
                position: relative;
            }

            .option-item input[type="radio"] {
                position: absolute;
                opacity: 0;
                height: 0;
                width: 0;
            }

            .answer-btn {
                display: block;
                width: 100%;
                padding: 1rem 1.25rem;
                text-align: left;
                border-radius: 10px;
                transition: all 0.2s;
                font-weight: 600;
                border: 1px solid #c3dafe;
                color: #2b6cb0;
                background-color: #ebf4ff;
                cursor: pointer;
                box-sizing: border-box;
            }

            .answer-btn:hover {
                background-color: #cee0f2;
                transform: translateY(-1px);
            }

            .option-item input:checked + .answer-btn {
                background-color: #3182ce;
                border-color: #2c5282;
                color: white;
            }

            .answer-btn.correct {
                background-color: #48bb78 !important;
                border-color: #2f855a !important;
                color: white !important;
                animation: bounce 0.6s ease-out;
            }

            .answer-btn.incorrect {
                background-color: #f56565 !important;
                border-color: #c53030 !important;
                color: white !important;
                animation: shake 0.5s ease-in-out;
            }

            .text-input-styled {
                width: 100%;
                padding: 1rem 1.25rem;
                font-size: 1.1rem;
                border: 2px solid #c3dafe;
                border-radius: 10px;
                box-sizing: border-box;
            }

            .text-input-styled.correct {
                border-color: #48bb78;
                background-color: #f0fff4;
                color: #2f855a;
                animation: bounce 0.6s ease-out;
            }

            .text-input-styled.incorrect {
                border-color: #f56565;
                background-color: #fff5f5;
                color: #c53030;
                animation: shake 0.5s ease-in-out;
            }

            #feedback-area {
                margin-top: 1rem;
                padding: 1.5rem;
                border-radius: 10px;
                font-weight: 500;
                display: none;
                opacity: 0;
            }

            #feedback-area.visible {
                display: block;
                animation: zoomFeedback 0.4s forwards;
            }

            .feedback-correct {
                background-color: #e6fffa;
                color: #276749;
                border: 1px solid #48bb78;
            }

            .feedback-incorrect {
                background-color: #fff5f5;
                color: #c53030;
                border: 1px solid #f56565;
            }

            .main-btn-container {
                margin-top: 2rem;
                display: flex;
                justify-content: center;
            }

            #main-btn {
                background-color: #4c51bf;
                color: white;
                padding: 1rem 2.5rem;
                border-radius: 12px;
                font-weight: 800;
                font-size: 1.1rem;
                transition: all 0.3s;
                width: 100%;
                border: none;
                cursor: pointer;
            }

            #main-btn:disabled {
                background-color: #a0aec0;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

            .math-frac {
                display: inline-block;
                vertical-align: middle;
                text-align: center;
                font-size: 0.9em;
            }

            .math-num {
                border-bottom: 1px solid;
                display: block;
                padding: 0 2px;
            }

            .math-den {
                display: block;
                padding: 0 2px;
            }

            .couleur-qui-change {
                animation: couleur-qui-change 14s infinite alternate;
                font-weight: bold;
            }

            .hidden {
                display: none !important;
            }
        </style>
    </head>

    <body>
        <div class="quiz-container">
            <div class="header">
                <h1>Révisions Français 3ème : Grammaire et Expression</h1>
                <p class="anim-wipe-in">Troisième - QCM Aléatoire</p>
            </div>
            <div id="nav-container" class="nav-grid"></div>

            <div id="quiz-ui" class="hidden">
                <div class="progress-bar-container">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>

                <div
                    style="
                        display: flex;
                        justify-content: space-between;
                        color: #a0aec0;
                        font-size: 0.9em;
                        margin-bottom: 10px;
                        font-weight: 600;
                    "
                >
                    <span id="cat-label">CATÉGORIE</span>
                    <span id="counter-label">1/10</span>
                </div>

                <div
                    id="question-card-container"
                    class="question-card entering"
                >
                    <div id="question-text" class="question-text"></div>
                    <div id="image-area" class="img-container hidden"></div>

                    <div id="input-area"></div>
                </div>

                <div id="feedback-area"></div>

                <div class="main-btn-container">
                    <button id="main-btn" onclick="app.checkAnswer()">
                        Valider la réponse
                    </button>
                </div>
            </div>
        </div>

        <script>
            const db = [
                {
                    category: "Électricité - Loi d'Ohm et Puissance",
                    questions: [
                        {
                            text: "Quelle est la relation entre la tension U, la résistance R et l'intensité I ?",
                            type: "mcq",
                            options: [
                                "U = R + I",
                                "U = R × I",
                                "U = R / I",
                                "U = R - I",
                            ],
                            correct: 1,
                            solution:
                                "La loi d'Ohm s'écrit U = R × I, avec U en volts, R en ohms et I en ampères.",
                        },
                        {
                            text: "Une résistance de 100 Ω est traversée par un courant de 0,2 A. Quelle est la tension à ses bornes ?",
                            type: "mcq",
                            options: ["20 V", "500 V", "50 V", "2 V"],
                            correct: 0,
                            solution: "U = R × I = 100 × 0,2 = 20 V.",
                        },
                        {
                            text: "Quelle est l'unité de la résistance électrique ?",
                            type: "mcq",
                            options: [
                                "Le volt",
                                "L'ampère",
                                "L'ohm",
                                "Le watt",
                            ],
                            correct: 2,
                            solution:
                                "La résistance électrique se mesure en ohms (symbole Ω).",
                        },
                        {
                            text: "Un appareil sous 230 V est traversé par 2 A. Quelle est sa puissance ?",
                            type: "mcq",
                            options: ["115 W", "460 W", "232 W", "228 W"],
                            correct: 1,
                            solution: "P = U × I = 230 × 2 = 460 W.",
                        },
                        {
                            text: "Quelle est la formule de la puissance électrique en courant continu ?",
                            type: "mcq",
                            options: [
                                "P = U / I",
                                "P = U + I",
                                "P = U × I",
                                "P = U - I",
                            ],
                            correct: 2,
                            solution:
                                "La puissance électrique en courant continu est P = U × I.",
                        },
                        {
                            text: "Dans une résistance de 50 Ω circule un courant de 4 A. Quelle tension applique-t-on ?",
                            type: "text",
                            accepted: [
                                "200 V",
                                "200V",
                                "200",
                                "deux cents volts",
                            ],
                            solution: "U = R × I = 50 × 4 = 200 V.",
                        },
                        {
                            text: "Sous 12 V, une résistance est parcourue par 0,5 A. Quelle est sa valeur ?",
                            type: "mcq",
                            options: ["6 Ω", "24 Ω", "12,5 Ω", "11,5 Ω"],
                            correct: 1,
                            solution: "R = U / I = 12 / 0,5 = 24 Ω.",
                        },
                        {
                            text: "Un moteur de 1000 W sous 230 V absorbe un courant de :",
                            type: "mcq",
                            options: [
                                "230 000 A",
                                "4,35 A environ",
                                "770 A",
                                "1000 A",
                            ],
                            correct: 1,
                            solution: "I = P / U = 1000 / 230 ≈ 4,35 A.",
                        },
                        {
                            text: "Une lampe de 60 W fonctionne sous 230 V. Quelle intensité la traverse ?",
                            type: "text",
                            accepted: [
                                "0,26 A",
                                "0.26",
                                "0,26A",
                                "0,26 ampère",
                            ],
                            solution: "I = P / U = 60 / 230 ≈ 0,26 A.",
                        },
                        {
                            text: "L'unité de la puissance électrique est :",
                            type: "mcq",
                            options: [
                                "Le joule",
                                "Le volt",
                                "Le watt",
                                "L'ohm",
                            ],
                            correct: 2,
                            solution:
                                "La puissance électrique se mesure en watts (W).",
                        },
                        {
                            text: "Une résistance de 10 Ω sous 5 V consomme quelle puissance ?",
                            type: "mcq",
                            options: ["50 W", "2,5 W", "15 W", "0,5 W"],
                            correct: 1,
                            solution:
                                "I = U/R = 5/10 = 0,5 A. P = U × I = 5 × 0,5 = 2,5 W.",
                        },
                        {
                            text: "La loi d'Ohm relie :",
                            type: "mcq",
                            options: [
                                "Puissance, tension, intensité",
                                "Tension, résistance, intensité",
                                "Énergie, puissance, temps",
                                "Masse, poids, gravité",
                            ],
                            correct: 1,
                            solution:
                                "La loi d'Ohm relie la tension U, la résistance R et l'intensité I.",
                        },
                        {
                            text: "Que vaut la tension aux bornes d'une résistance de 220 Ω traversée par 0,1 A ?",
                            type: "text",
                            accepted: ["22 V", "22V", "22"],
                            solution: "U = R × I = 220 × 0,1 = 22 V.",
                        },
                        {
                            text: "Un fer à repasser de 2200 W sous 230 V consomme :",
                            type: "mcq",
                            options: ["10 A", "23 A", "100 A", "230 A"],
                            correct: 0,
                            solution: "I = P / U = 2200 / 230 ≈ 10 A.",
                        },
                        {
                            text: "Quelle est la puissance d'un appareil sous 24 V avec 3 A ?",
                            type: "text",
                            accepted: ["72 W", "72", "72 watts"],
                            solution: "P = U × I = 24 × 3 = 72 W.",
                        },
                        {
                            text: "Dans un dipôle ohmique, la caractéristique U(I) est :",
                            type: "mcq",
                            options: [
                                "Une courbe",
                                "Une droite passant par l'origine",
                                "Une droite horizontale",
                                "Une parabole",
                            ],
                            correct: 1,
                            solution:
                                "La caractéristique d'un dipôle ohmique est une droite passant par l'origine.",
                        },
                        {
                            text: "Si on double la tension aux bornes d'une résistance fixe, l'intensité :",
                            type: "mcq",
                            options: [
                                "Reste identique",
                                "Double",
                                "Est divisée par 2",
                                "Quadruple",
                            ],
                            correct: 1,
                            solution:
                                "Selon la loi d'Ohm, si U double alors I double (R est constante).",
                        },
                        {
                            text: "Quelle résistance faut-il pour avoir 2 A sous 10 V ?",
                            type: "mcq",
                            options: ["20 Ω", "5 Ω", "12 Ω", "8 Ω"],
                            correct: 1,
                            solution: "R = U / I = 10 / 2 = 5 Ω.",
                        },
                        {
                            text: "La puissance dissipée par effet Joule dans une résistance R traversée par I est :",
                            type: "mcq",
                            options: [
                                "P = R × I",
                                "P = R × I²",
                                "P = R / I",
                                "P = R + I",
                            ],
                            correct: 1,
                            solution:
                                "P = R × I² est la puissance dissipée par effet Joule.",
                        },
                        {
                            text: "Une résistance de 5 Ω parcourue par 3 A dissipe :",
                            type: "mcq",
                            options: ["15 W", "45 W", "8 W", "75 W"],
                            correct: 1,
                            solution: "P = R × I² = 5 × 3² = 5 × 9 = 45 W.",
                        },
                        {
                            text: "Si U = 200 V et I = 5 A, alors R vaut :",
                            type: "text",
                            accepted: ["40 Ω", "40", "40 ohms"],
                            solution: "R = U / I = 200 / 5 = 40 Ω.",
                        },
                        {
                            text: "Un radiateur de 1500 W sous 230 V absorbe :",
                            type: "mcq",
                            options: [
                                "Environ 6,5 A",
                                "Environ 65 A",
                                "Environ 650 A",
                                "1500 A",
                            ],
                            correct: 0,
                            solution: "I = P / U = 1500 / 230 ≈ 6,5 A.",
                        },
                        {
                            text: "La tension du réseau électrique domestique en France est :",
                            type: "mcq",
                            options: ["110 V", "230 V", "400 V", "12 V"],
                            correct: 1,
                            solution:
                                "La tension du réseau domestique en France est 230 V.",
                        },
                        {
                            text: "Que signifie l'indication '6 V - 3 W' sur une lampe ?",
                            type: "mcq",
                            options: [
                                "Tension 6 V et intensité 3 A",
                                "Tension 6 V et puissance 3 W",
                                "Puissance 6 W et tension 3 V",
                                "Résistance 6 Ω et puissance 3 W",
                            ],
                            correct: 1,
                            solution:
                                "La lampe fonctionne normalement sous 6 V et consomme alors 3 W.",
                        },
                        {
                            text: "Une lampe '6 V - 3 W' absorbe quelle intensité en fonctionnement normal ?",
                            type: "mcq",
                            options: ["2 A", "0,5 A", "18 A", "9 A"],
                            correct: 1,
                            solution: "I = P / U = 3 / 6 = 0,5 A.",
                        },
                        {
                            text: "La résistance à chaud de cette lampe '6 V - 3 W' est :",
                            type: "mcq",
                            options: ["2 Ω", "12 Ω", "18 Ω", "0,5 Ω"],
                            correct: 1,
                            solution: "R = U / I = 6 / 0,5 = 12 Ω.",
                        },
                        {
                            text: "Que se passe-t-il si on dépasse la puissance nominale d'un appareil ?",
                            type: "mcq",
                            options: [
                                "Il fonctionne mieux",
                                "Il risque de griller",
                                "Il s'éteint",
                                "Rien",
                            ],
                            correct: 1,
                            solution:
                                "Dépasser la puissance nominale peut endommager l'appareil par surchauffe.",
                        },
                        {
                            text: "Dans un circuit en série, l'intensité :",
                            type: "mcq",

                                "Est différente partout",
                                "Est la même partout",
                                "Est nulle",
                                "Augmente à chaque dipôle",

                            correct: 1,
                            solution:
                                "Dans un circuit en série, l'intensité est identique en tout point.",

                        {
                            text: "Dans un circuit en dérivation, la tension aux bornes de chaque branche :",
                            type: "mcq",
                            options: [
                                "Est différente",
                                "Est la même",
                                "Est nulle",
                                "Varie aléatoirement",

                            correct: 1,
                            solution:
                                "Dans un circuit en dérivation, la tension est la même aux bornes de chaque branche.",

                        {
                            text: "La loi des nœuds dit que :",

                                "La somme des tensions est nulle",
                                "La somme des intensités arrivant à un nœud égale la somme qui en sort",
                                "L'intensité augmente",

                                "Les tensions",

                        {
                            text: "Dans une maille, la somme algébrique des tensions est :",

                            accepted: ["nulle", "0", "zéro", "0 V"],

                                "La loi des mailles stipule que la somme des tensions dans une maille est nulle.",

                        {
                            text: "Deux résistances R1 = 10 Ω et R2 = 20 Ω en série ont une résistance équivalente :",

                            options: ["30 Ω", "200 Ω", "15 Ω", "10 Ω"],

                            solution:
                                "En série : Req = R1 + R2 = 10 + 20 = 30 Ω.",

                        {
                            text: "Deux résistances de 100 Ω en parallèle ont une résistance équivalente de :",

                            text: "Le symbole de l'unité de la résistance est :",

                        {
                            text: "L'ampèremètre se branche :",

                                "N'importe comment",

                        {
                            text: "Le voltmètre se branche :",
                            type: "mcq",
                            options: [
                                "En série",
                                "En dérivation (parallèle)",
                                "Dans le générateur uniquement",
                                "Entre deux nœuds uniquement",

                            correct: 1,
                            solution:
                                "Le voltmètre se branche en dérivation aux bornes du dipôle.",

                        {
                            text: "L'unité de l'intensité électrique est :",

            const app = {
                state: {
                    catIdx: 0,
                    qIdx: 0,
                },

                init: function () {
                    this.renderMenu();
                },

                renderMenu: function () {
                    const nav = document.getElementById("nav-container");
                    nav.innerHTML = "";
                    document.getElementById("quiz-ui").classList.add("hidden");
                    document
                        .getElementById("nav-container")
                        .classList.remove("hidden");

                    db.forEach((cat, idx) => {
                        const btn = document.createElement("div");
                        btn.className = "nav-btn";
                        btn.textContent = cat.category;
                        btn.onclick = () => this.startCategory(idx);
                        nav.appendChild(btn);
                    });
                },

                startCategory: function (idx) {
                    this.state.catIdx = idx;
                    this.state.qIdx = 0;

                    document
                        .getElementById("nav-container")
                        .classList.add("hidden");
                    document
                        .getElementById("quiz-ui")
                        .classList.remove("hidden");
                    this.renderQuestion();
                },

                renderQuestion: function () {
                    const q = db[this.state.catIdx].questions[this.state.qIdx];
                    const card = document.getElementById(
                        "question-card-container",
                    );
                    const feedback = document.getElementById("feedback-area");
                    const btn = document.getElementById("main-btn");

                    card.classList.remove("fast-exit", "entering");
                    void card.offsetWidth;
                    card.classList.add("entering");

                    feedback.className = "";
                    feedback.classList.remove("visible");
                    feedback.style.display = "none";

                    btn.textContent = "Valider la réponse";
                    btn.disabled = false;
                    btn.style.backgroundColor = "#4c51bf";

                    document.getElementById("cat-label").textContent =
                        db[this.state.catIdx].category;
                    document.getElementById("counter-label").textContent =
                        `${this.state.qIdx + 1} / ${db[this.state.catIdx].questions.length}`;
                    document.getElementById("question-text").innerHTML = q.text;

                    const imgArea = document.getElementById("image-area");
                    if (q.image) {
                        imgArea.innerHTML = `<img src="${q.image}">`;
                        imgArea.classList.remove("hidden");
                    } else {
                        imgArea.classList.add("hidden");
                    }

                    const pct =
                        (this.state.qIdx /
                            db[this.state.catIdx].questions.length) *
                        100;
                    document.getElementById("progress-fill").style.width =
                        pct + "%";

                    const inputArea = document.getElementById("input-area");
                    inputArea.innerHTML = "";

                    if (q.type === "mcq") {
                        const container = document.createElement("div");
                        container.className = "options-container";

                        let mixedOptions = q.options.map(
                            (optText, originalIndex) => {
                                return { text: optText, val: originalIndex };
                            },
                        );

                        mixedOptions.sort(() => Math.random() - 0.5);

                        mixedOptions.forEach((optObj, i) => {
                            const item = document.createElement("div");
                            item.className = "option-item";
                            item.innerHTML = `
                              <input type="radio" name="quiz-opt" id="opt-${i}" value="${optObj.val}">
                              <label class="answer-btn" for="opt-${i}">${optObj.text}</label>
                          `;
                            container.appendChild(item);
                        });
                        inputArea.appendChild(container);
                    } else {
                        inputArea.innerHTML = `<input type="text" id="text-answer" class="text-input-styled" placeholder="Ta réponse..." autocomplete="off">`;
                        document
                            .getElementById("text-answer")
                            .addEventListener("keypress", (e) => {
                                if (e.key === "Enter") this.checkAnswer();
                            });
                        setTimeout(
                            () =>
                                document.getElementById("text-answer").focus(),
                            100,
                        );
                    }
                },

                checkAnswer: function () {
                    const q = db[this.state.catIdx].questions[this.state.qIdx];
                    const feedback = document.getElementById("feedback-area");
                    feedback.style.display = "block";
                    const btn = document.getElementById("main-btn");
                    let isCorrect = false;
                    let userElement = null;

                    if (q.type === "mcq") {
                        const selected = document.querySelector(
                            'input[name="quiz-opt"]:checked',
                        );
                        if (!selected) return alert("Choisis une réponse !");

                        const label = document.querySelector(
                            `label[for="${selected.id}"]`,
                        );
                        userElement = label;

                        if (parseInt(selected.value) === q.correct) {
                            isCorrect = true;
                        }
                    } else {
                        const input = document.getElementById("text-answer");
                        if (!input.value.trim())
                            return alert("Écris une réponse !");
                        userElement = input;

                        const val = input.value
                            .toLowerCase()
                            .replace(/\s/g, "")
                            .replace(",", ".");
                        const accepted = q.accepted.map((a) =>
                            a
                                .toLowerCase()
                                .replace(/\s/g, "")
                                .replace(",", "."),
                        );
                        if (accepted.includes(val)) isCorrect = true;
                    }

                    btn.disabled = true;

                    if (isCorrect) {
                        userElement.classList.add("correct");
                        feedback.className = "feedback-correct visible";
                        feedback.innerHTML = `
                          <div style="font-size: 1.2em; margin-bottom: 5px;">✅ <span class="couleur-qui-change">Excellent !</span></div>
                          <div>${q.solution}</div>
                      `;
                        btn.style.backgroundColor = "#48bb78";
                        btn.textContent = "Bravo !";
                    } else {
                        userElement.classList.add("incorrect");

                        if (q.type === "mcq") {
                            const correctInput = document.querySelector(
                                `input[name="quiz-opt"][value="${q.correct}"]`,
                            );
                            if (correctInput) {
                                const correctLabel = document.querySelector(
                                    `label[for="${correctInput.id}"]`,
                                );
                                correctLabel.classList.add("correct");
                            }
                        }

                        feedback.className = "feedback-incorrect visible";
                        feedback.innerHTML = `
                          <div style="font-size: 1.2em; margin-bottom: 5px;">❌ Aïe... Regarde la correction :</div>
                          <div><strong>${q.solution}</strong></div>
                      `;
                        btn.style.backgroundColor = "#c53030";
                        btn.textContent = "Lecture correction...";
                    }

                    const pct =
                        ((this.state.qIdx + 1) /
                            db[this.state.catIdx].questions.length) *
                        100;
                    document.getElementById("progress-fill").style.width =
                        pct + "%";

                    const delayDuration = isCorrect ? 1200 : 4000;

                    setTimeout(() => {
                        this.handleTransition();
                    }, delayDuration);
                },

                handleTransition: function () {
                    if (
                        this.state.qIdx >=
                        db[this.state.catIdx].questions.length - 1
                    ) {
                        alert("Série terminée ! Retour au menu.");
                        this.renderMenu();
                        return;
                    }

                    const card = document.getElementById(
                        "question-card-container",
                    );
                    card.classList.remove("entering");
                    card.classList.add("fast-exit");

                    setTimeout(() => {
                        this.state.qIdx++;
                        this.renderQuestion();
                    }, 300);
                },
            };

            window.onload = () => app.init();
        </script>

        <!-- BOUTON RETOUR PWA -->
        <script>
            (function () {
                const checkAndAddButton = () => {
                    const isPWA =
                        window.matchMedia("(display-mode: standalone)")
                            .matches ||
                        window.matchMedia("(display-mode: fullscreen)")
                            .matches ||
                        navigator.standalone;

                    if (
                        isPWA &&
                        !window.location.pathname.endsWith("index.html")
                    ) {
                        const btn = document.createElement("button");
                        btn.innerHTML = "← Retour";
                        btn.style.position = "fixed";
                        btn.style.top = "15px";
                        btn.style.left = "15px";
                        btn.style.zIndex = "9999";
                        btn.style.background = "#4CAF50";
                        btn.style.color = "white";
                        btn.style.border = "none";
                        btn.style.padding = "10px 20px";
                        btn.style.borderRadius = "8px";
                        btn.style.cursor = "pointer";
                        btn.style.boxShadow = "0 4px 10px rgba(0,0,0,0.5)";
                        btn.style.fontWeight = "bold";
                        btn.style.fontFamily = "Arial, sans-serif";
                        btn.style.fontSize = "16px";
                        btn.style.transition =
                            "background 0.3s, transform 0.3s";

                        btn.onmouseover = () => {
                            btn.style.background = "#45a049";
                            btn.style.transform = "scale(1.05)";
                        };
                        btn.onmouseout = () => {
                            btn.style.background = "#4CAF50";
                            btn.style.transform = "scale(1)";
                        };

                        btn.onclick = () => {
                            window.location.href = "../index.html";
                        };

                        document.body.appendChild(btn);
                    }
                };

                if (document.readyState === "loading") {
                    document.addEventListener(
                        "DOMContentLoaded",
                        checkAndAddButton,
                    );
                } else {
                    checkAndAddButton();
                }
            })();
        </script>
    </body>
</html>
