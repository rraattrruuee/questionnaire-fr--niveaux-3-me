name: Update Assets and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make script executable
        run: chmod +x generate-sw.sh

      - name: Update Service Worker
        run: |
          ./generate-sw.sh
          # Sécurité : on supprime le fichier temporaire s'il existe encore
          rm -f service-worker.js.tmp

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # On ajoute les modifs du script ET du service-worker
          git add generate-sw.sh service-worker.js

          # Vérification robuste des changements
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ Aucun changement détecté dans les fichiers."
          else
            echo "🚀 Changements détectés, commit en cours..."
            git commit -m "chore: auto-update service worker assets [skip ci]"
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
