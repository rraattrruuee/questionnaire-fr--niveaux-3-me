<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../quiz_icon.svg" type="image/x-icon" />
    <title>Mathématiques : fonctions affines et linéaires</title>
    <style>
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }

        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      @keyframes headerDrop {
        from {
          opacity: 0;
          transform: translateY(-50px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }

        40% {
          transform: translateY(-5px);
        }

        60% {
          transform: translateY(-3px);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }

        20%,
        60% {
          transform: translateX(-5px);
        }

        40%,
        80% {
          transform: translateX(5px);
        }
      }

      @keyframes zoomFeedback {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }

        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes couleur-qui-change {
        0%,
        10% {
          color: white;
        }

        30% {
          color: #00ff00;
        }

        38% {
          color: #ffff00;
        }

        46% {
          color: #ff00ff;
        }

        54% {
          color: #00ffff;
        }

        60% {
          color: #ffa500;
        }

        68% {
          color: #7cfc00;
        }

        76% {
          color: #ff69b4;
        }

        84% {
          color: #8a2be2;
        }

        92% {
          color: #ff4500;
        }

        100% {
          color: deeppink;
        }
      }

      @keyframes wipe-in {
        from {
          clip-path: inset(0 100% 0 0);
        }

        to {
          clip-path: inset(0 0 0 0);
        }
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f0f4f8;
        padding: 1rem;
        line-height: 1.6;
        min-height: 100vh;
      }

      .quiz-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        overflow: hidden;
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #1a202c;
        animation: headerDrop 0.8s ease-out;
      }

      .progress-bar-container {
        width: 100%;
        height: 8px;
        background-color: #edf2f7;
        border-radius: 4px;
        margin-bottom: 20px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #4c51bf, #667eea);
        width: 0%;
        transition: width 0.4s ease-out;
      }

      .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        animation: slideIn 0.6s ease-out;
      }

      .nav-btn {
        display: block;
        width: 100%;
        padding: 1.5rem;
        text-align: center;
        border-radius: 15px;
        transition: all 0.2s;
        font-weight: 700;
        border: 2px solid #c3dafe;
        color: #2b6cb0;
        background-color: #ebf4ff;
        cursor: pointer;
        box-sizing: border-box;
      }

      .nav-btn:hover {
        background-color: #cee0f2;
        transform: translateY(-3px);
        border-color: #4c51bf;
      }

      .question-card {
        min-height: 200px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        border-radius: 15px;
        background-color: #f7faff;
        border: 2px solid #e2e8f0;
        opacity: 0;
        transform: translateY(20px);
      }

      .question-card.entering {
        animation: slideIn 0.5s ease-out forwards;
      }

      .question-card.fast-exit {
        animation: slideOut 0.3s ease-in forwards;
      }

      .question-text {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: #2d3748;
      }

      .img-container {
        text-align: center;
        margin: 15px 0;
      }

      .img-container img {
        max-width: 100%;
        border-radius: 8px;
      }

      .options-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .option-item {
        position: relative;
      }

      .option-item input[type="radio"] {
        position: absolute;
        opacity: 0;
        height: 0;
        width: 0;
      }

      .answer-btn {
        display: block;
        width: 100%;
        padding: 1rem 1.25rem;
        text-align: left;
        border-radius: 10px;
        transition: all 0.2s;
        font-weight: 600;
        border: 1px solid #c3dafe;
        color: #2b6cb0;
        background-color: #ebf4ff;
        cursor: pointer;
        box-sizing: border-box;
      }

      .answer-btn:hover {
        background-color: #cee0f2;
        transform: translateY(-1px);
      }

      .option-item input:checked + .answer-btn {
        background-color: #3182ce;
        border-color: #2c5282;
        color: white;
      }

      .answer-btn.correct {
        background-color: #48bb78 !important;
        border-color: #2f855a !important;
        color: white !important;
        animation: bounce 0.6s ease-out;
      }

      .answer-btn.incorrect {
        background-color: #f56565 !important;
        border-color: #c53030 !important;
        color: white !important;
        animation: shake 0.5s ease-in-out;
      }

      .text-input-styled {
        width: 100%;
        padding: 1rem 1.25rem;
        font-size: 1.1rem;
        border: 2px solid #c3dafe;
        border-radius: 10px;
        box-sizing: border-box;
      }

      .text-input-styled.correct {
        border-color: #48bb78;
        background-color: #f0fff4;
        color: #2f855a;
        animation: bounce 0.6s ease-out;
      }

      .text-input-styled.incorrect {
        border-color: #f56565;
        background-color: #fff5f5;
        color: #c53030;
        animation: shake 0.5s ease-in-out;
      }

      #feedback-area {
        margin-top: 1rem;
        padding: 1.5rem;
        border-radius: 10px;
        font-weight: 500;
        display: none;
        opacity: 0;
      }

      #feedback-area.visible {
        display: block;
        animation: zoomFeedback 0.4s forwards;
      }

      .feedback-correct {
        background-color: #e6fffa;
        color: #276749;
        border: 1px solid #48bb78;
      }

      .feedback-incorrect {
        background-color: #fff5f5;
        color: #c53030;
        border: 1px solid #f56565;
      }

      .main-btn-container {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
      }

      #main-btn {
        background-color: #4c51bf;
        color: white;
        padding: 1rem 2.5rem;
        border-radius: 12px;
        font-weight: 800;
        font-size: 1.1rem;
        transition: all 0.3s;
        width: 100%;
        border: none;
        cursor: pointer;
      }

      #main-btn:disabled {
        background-color: #a0aec0;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .math-frac {
        display: inline-block;
        vertical-align: middle;
        text-align: center;
        font-size: 0.9em;
      }

      .math-num {
        border-bottom: 1px solid;
        display: block;
        padding: 0 2px;
      }

      .math-den {
        display: block;
        padding: 0 2px;
      }

      .couleur-qui-change {
        animation: couleur-qui-change 14s infinite alternate;
        font-weight: bold;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div class="quiz-container">
      <div class="header">
        <h1>fonctions affines et linéaires</h1>
        <p class="anim-wipe-in">Troisième - QCM Aléatoire</p>
      </div>
      <div id="nav-container" class="nav-grid"></div>

      <div id="quiz-ui" class="hidden">
        <div class="progress-bar-container">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            color: #a0aec0;
            font-size: 0.9em;
            margin-bottom: 10px;
            font-weight: 600;
          "
        >
          <span id="cat-label">CATÉGORIE</span>
          <span id="counter-label">1/10</span>
        </div>

        <div id="question-card-container" class="question-card entering">
          <div id="question-text" class="question-text"></div>
          <div id="image-area" class="img-container hidden"></div>

          <div id="input-area"></div>
        </div>

        <div id="feedback-area"></div>

        <div class="main-btn-container">
          <button id="main-btn" onclick="app.checkAnswer()">
            Valider la réponse
          </button>
        </div>
      </div>
    </div>

    <script>
      const db = [
        {
          category: "Evaluation fonctions affines et linéaires",
          questions: [
            {
              text: "Quelle est la proportion représentée par 25% d'une classe de 32 élèves ?",
              type: "text",
              accepted: ["8"],
              solution:
                "Pour calculer 25% de 32, on effectue : <div class='math-frac'><span class='math-num'>25</span><span class='math-den'>100</span></div> × 32 = 0.25 × 32 = 8.",
            },
            {
              text: "Quel pourcentage représentent 7 élèves parmi un total de 28 ?",
              type: "mcq",
              options: ["20%", "25%", "30%", "15%"],
              correct: 1,
              solution:
                "On calcule le rapport <div class='math-frac'><span class='math-num'>7</span><span class='math-den'>28</span></div> = 0.25. En multipliant par 100, on obtient 25%.",
            },
            {
              text: "Une fonction linéaire f est de la forme :",
              type: "mcq",
              options: [
                "f(x) = ax + b",
                "f(x) = ax<sup>2</sup>",
                "f(x) = ax",
                "f(x) = a + x",
              ],
              correct: 2,
              solution:
                "Par définition, une fonction linéaire traduit une situation de proportionnalité et s'écrit f(x) = ax.",
            },
            {
              text: "Soit f(x) = 5x. Quelle est l'image de -3 par f ?",
              type: "text",
              accepted: ["-15"],
              solution: "On remplace x par -3 : f(-3) = 5 × (-3) = -15.",
            },
            {
              text: "Soit f(x) = -2x. Quel est l'antécédent de 10 par f ?",
              type: "text",
              accepted: ["-5"],
              solution:
                "On résout l'équation -2x = 10, d'où x = <div class='math-frac'><span class='math-num'>10</span><span class='math-den'>-2</span></div> = -5.",
            },
            {
              text: "La représentation graphique d'une fonction linéaire est une droite qui :",
              type: "mcq",
              options: [
                "Est parallèle à l'axe des abscisses",
                "Passe par l'origine du repère",
                "Passe par le point (0, 1)",
                "Est toujours verticale",
              ],
              correct: 1,
              solution:
                "Une fonction linéaire traduit la proportionnalité, sa droite passe donc toujours par l'origine O(0,0).",
            },
            {
              text: "Déterminer le coefficient 'a' d'une fonction linéaire f telle que f(5) = -3.",
              type: "mcq",
              options: ["-1.6", "-0.6", "1.6", "0.6"],
              correct: 1,
              solution:
                "On sait que f(x) = ax. Donc 5a = -3, d'où a = <div class='math-frac'><span class='math-num'>-3</span><span class='math-den'>5</span></div> = -0.6.",
            },
            {
              text: "Augmenter un prix de 17% revient à multiplier par :",
              type: "text",
              accepted: ["1.17"],
              solution:
                "Augmenter de 17% revient à calculer 1 + <div class='math-frac'><span class='math-num'>17</span><span class='math-den'>100</span></div> = 1.17.",
            },
            {
              text: "Une réduction de 20% sur un prix x est modélisée par la fonction linéaire :",
              type: "mcq",
              options: [
                "f(x) = 0.2x",
                "f(x) = 0.8x",
                "f(x) = 1.2x",
                "f(x) = x - 20",
              ],
              correct: 1,
              solution:
                "Réduire de 20% revient à multiplier par 1 - 0.20 = 0.80. Donc f(x) = 0.8x.",
            },
            {
              text: "Soit f(x) = 3x - 11. Calculer l'image de -5.",
              type: "text",
              accepted: ["-26"],
              solution: "f(-5) = 3 × (-5) - 11 = -15 - 11 = -26.",
            },
            {
              text: "Trouver l'antécédent de 14 par la fonction f(x) = 3x - 11.",
              type: "mcq",
              options: [
                "x = 5",
                "x = <div class='math-frac'><span class='math-num'>25</span><span class='math-den'>3</span></div>",
                "x = 1",
                "x = 8.33",
              ],
              correct: 1,
              solution:
                "On résout 3x - 11 = 14 => 3x = 14 + 11 => 3x = 25 => x = <div class='math-frac'><span class='math-num'>25</span><span class='math-den'>3</span></div>.",
            },
            {
              text: "Dans f(x) = ax + b, comment appelle-t-on le nombre 'b' ?",
              type: "mcq",
              options: [
                "Le coefficient directeur",
                "L'antécédent",
                "L'ordonnée à l'origine",
                "La pente",
              ],
              correct: 2,
              solution:
                "Le nombre 'b' est l'ordonnée à l'origine, c'est la valeur de f(0).",
            },
            {
              text: "Soit la fonction affine f(x) = -3x + 7. Quel point appartient à sa droite ?",
              type: "mcq",
              options: ["(0, 0)", "(1, 10)", "(2, 1)", "(7, 0)"],
              correct: 2,
              solution:
                "Calculons f(2) = -3 × 2 + 7 = -6 + 7 = 1. Le point (2, 1) appartient donc à la droite.",
            },
            {
              text: "Calculer le coefficient directeur 'a' de la fonction affine passant par f(3) = -13 et f(-4) = 22.",
              type: "text",
              accepted: ["-5"],
              solution:
                "a = <div class='math-frac'><span class='math-num'>f(3) - f(-4)</span><span class='math-den'>3 - (-4)</span></div> = <div class='math-frac'><span class='math-num'>-13 - 22</span><span class='math-den'>7</span></div> = <div class='math-frac'><span class='math-num'>-35</span><span class='math-den'>7</span></div> = -5.",
            },
            {
              text: "Si f(x) = -5x + b et f(3) = -13, quelle est la valeur de b ?",
              type: "text",
              accepted: ["2", "+2"],
              solution:
                "f(3) = -5 × 3 + b = -13 => -15 + b = -13 => b = -13 + 15 = 2.",
            },
            {
              text: "Un tarif de ski propose un forfait de 435€ pour la saison illimitée. De quel type de fonction s'agit-il ?",
              type: "mcq",
              options: ["Linéaire", "Affine", "Constante", "Carrée"],
              correct: 2,
              solution:
                "Le prix ne dépend pas de x (nombre de jours), c'est une fonction constante f(x) = 435.",
            },
            {
              text: "Un abonnement de téléphone coûte 10€ par mois plus 0.05€ par SMS. L'expression du prix est :",
              type: "text",
              accepted: ["0.05x+10", "10+0.05x"],
              solution:
                "Le coût fixe est b = 10 et le coût variable est a = 0.05. Donc f(x) = 0.05x + 10.",
            },
            {
              text: "La droite représentant une fonction affine coupe l'axe des ordonnées au point de coordonnées :",
              type: "mcq",
              options: ["(a, 0)", "(0, b)", "(b, 0)", "(0, a)"],
              correct: 1,
              solution:
                "L'ordonnée à l'origine est la valeur de y quand x = 0. f(0) = a×0 + b = b. Le point est (0, b).",
            },
            {
              text: "Soit g(x) = <div class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></div>x - <div class='math-frac'><span class='math-num'>7</span><span class='math-den'>5</span></div>. Cette fonction est :",
              type: "mcq",
              options: ["Linéaire", "Affine", "Constante", "Aucune des trois"],
              correct: 1,
              solution:
                "Elle est de la forme ax + b avec a = 2/3 et b = -7/5. C'est une fonction affine.",
            },
            {
              text: "Une fonction linéaire f est telle que f(2) = 4. Quelle est son expression ?",
              type: "text",
              accepted: ["f(x)=2x", "2x"],
              solution: "f(x) = ax. Donc 2a = 4, a = 2. f(x) = 2x.",
            },
            {
              text: "Regardez l'image. La droite passe par l'origine et le point (3, 5). Quelle est l'expression de la fonction ?",
              type: "mcq",
              options: [
                "f(x) = <div class='math-frac'><span class='math-num'>3</span><span class='math-den'>5</span></div>x",
                "f(x) = <div class='math-frac'><span class='math-num'>5</span><span class='math-den'>3</span></div>x",
                "f(x) = 3x + 5",
                "f(x) = 5x + 3",
              ],
              correct: 1,
              solution:
                "La droite passe par (0,0) donc f(x)=ax. Elle passe par (3, 5), donc f(3)=5, 3a=5, a = 5/3.",

      const app = {
        state: {
          catIdx: 0,
          qIdx: 0,
        },

        init: function () {
          this.renderMenu();
        },

        renderMenu: function () {
          const nav = document.getElementById("nav-container");
          nav.innerHTML = "";
          document.getElementById("quiz-ui").classList.add("hidden");
          document.getElementById("nav-container").classList.remove("hidden");

          db.forEach((cat, idx) => {
            const btn = document.createElement("div");
            btn.className = "nav-btn";
            btn.textContent = cat.category;
            btn.onclick = () => this.startCategory(idx);
            nav.appendChild(btn);
          });
        },

        startCategory: function (idx) {
          this.state.catIdx = idx;
          this.state.qIdx = 0;

          document.getElementById("nav-container").classList.add("hidden");
          document.getElementById("quiz-ui").classList.remove("hidden");
          this.renderQuestion();
        },

        renderQuestion: function () {
          const q = db[this.state.catIdx].questions[this.state.qIdx];
          const card = document.getElementById("question-card-container");
          const feedback = document.getElementById("feedback-area");
          const btn = document.getElementById("main-btn");

          card.classList.remove("fast-exit", "entering");
          void card.offsetWidth;
          card.classList.add("entering");

          feedback.className = "";
          feedback.classList.remove("visible");
          feedback.style.display = "none";

          btn.textContent = "Valider la réponse";
          btn.disabled = false;
          btn.style.backgroundColor = "#4c51bf";

          document.getElementById("cat-label").textContent =
            db[this.state.catIdx].category;
          document.getElementById("counter-label").textContent =
            `${this.state.qIdx + 1} / ${db[this.state.catIdx].questions.length}`;
          document.getElementById("question-text").innerHTML = q.text;

          const imgArea = document.getElementById("image-area");
          if (q.image) {
            imgArea.innerHTML = `<img src="${q.image}">`;
            imgArea.classList.remove("hidden");
          } else {
            imgArea.classList.add("hidden");
          }

          const pct =
            (this.state.qIdx / db[this.state.catIdx].questions.length) * 100;
          document.getElementById("progress-fill").style.width = pct + "%";

          const inputArea = document.getElementById("input-area");
          inputArea.innerHTML = "";

          if (q.type === "mcq") {
            const container = document.createElement("div");
            container.className = "options-container";

            let mixedOptions = q.options.map((optText, originalIndex) => {
              return { text: optText, val: originalIndex };
            });

            mixedOptions.sort(() => Math.random() - 0.5);

            mixedOptions.forEach((optObj, i) => {
              const item = document.createElement("div");
              item.className = "option-item";
              item.innerHTML = `
                        <input type="radio" name="quiz-opt" id="opt-${i}" value="${optObj.val}">
                        <label class="answer-btn" for="opt-${i}">${optObj.text}</label>
                    `;
              container.appendChild(item);
            });
            inputArea.appendChild(container);
          } else {
            inputArea.innerHTML = `<input type="text" id="text-answer" class="text-input-styled" placeholder="Ta réponse..." autocomplete="off">`;
            document
              .getElementById("text-answer")
              .addEventListener("keypress", (e) => {
                if (e.key === "Enter") this.checkAnswer();
              });
            setTimeout(
              () => document.getElementById("text-answer").focus(),
              100,
            );
          }
        },

        checkAnswer: function () {
          const q = db[this.state.catIdx].questions[this.state.qIdx];
          const feedback = document.getElementById("feedback-area");
          feedback.style.display = "block";
          const btn = document.getElementById("main-btn");
          let isCorrect = false;
          let userElement = null;

          if (q.type === "mcq") {
            const selected = document.querySelector(
              'input[name="quiz-opt"]:checked',
            );
            if (!selected) return alert("Choisis une réponse !");

            const label = document.querySelector(`label[for="${selected.id}"]`);
            userElement = label;

            if (parseInt(selected.value) === q.correct) {
              isCorrect = true;
            }
          } else {
            const input = document.getElementById("text-answer");
            if (!input.value.trim()) return alert("Écris une réponse !");
            userElement = input;

            const val = input.value
              .toLowerCase()
              .replace(/\s/g, "")
              .replace(",", ".");
            const accepted = q.accepted.map((a) =>
              a.toLowerCase().replace(/\s/g, "").replace(",", "."),
            );
            if (accepted.includes(val)) isCorrect = true;
          }

          btn.disabled = true;

          if (isCorrect) {
            userElement.classList.add("correct");
            feedback.className = "feedback-correct visible";
            feedback.innerHTML = `
                    <div style="font-size: 1.2em; margin-bottom: 5px;">✅ <span class="couleur-qui-change">Excellent !</span></div>
                    <div>${q.solution}</div>
                `;
            btn.style.backgroundColor = "#48bb78";
            btn.textContent = "Bravo !";
          } else {
            userElement.classList.add("incorrect");

            if (q.type === "mcq") {
              const correctInput = document.querySelector(
                `input[name="quiz-opt"][value="${q.correct}"]`,
              );
              if (correctInput) {
                const correctLabel = document.querySelector(
                  `label[for="${correctInput.id}"]`,
                );
                correctLabel.classList.add("correct");
              }
            }

            feedback.className = "feedback-incorrect visible";
            feedback.innerHTML = `
                    <div style="font-size: 1.2em; margin-bottom: 5px;">❌ Aïe... Regarde la correction :</div>
                    <div><strong>${q.solution}</strong></div>
                `;
            btn.style.backgroundColor = "#c53030";
            btn.textContent = "Lecture correction...";
          }

          const pct =
            ((this.state.qIdx + 1) / db[this.state.catIdx].questions.length) *
            100;
          document.getElementById("progress-fill").style.width = pct + "%";

          const delayDuration = isCorrect ? 1200 : 4000;

          setTimeout(() => {
            this.handleTransition();
          }, delayDuration);
        },

        handleTransition: function () {
          if (this.state.qIdx >= db[this.state.catIdx].questions.length - 1) {
            alert("Série terminée ! Retour au menu.");
            this.renderMenu();
            return;
          }

          const card = document.getElementById("question-card-container");
          card.classList.remove("entering");
          card.classList.add("fast-exit");

          setTimeout(() => {
            this.state.qIdx++;
            this.renderQuestion();
          }, 300);
        },
      };

      window.onload = () => app.init();
    </script>

                        navigator.standalone;
          
          if (isPWA && !window.location.pathname.endsWith('index.html')) {
            const btn = document.createElement('button');
            btn.innerHTML = '← Retour';
            btn.style.position = 'fixed';
            btn.style.top = '15px';
            btn.style.left = '15px';
            btn.style.zIndex = '9999';
            btn.style.background = '#4CAF50';
            btn.style.color = 'white';
            btn.style.border = 'none';
            btn.style.padding = '10px 20px';
            btn.style.borderRadius = '8px';
            btn.style.cursor = 'pointer';
            btn.style.boxShadow = '0 4px 10px rgba(0,0,0,0.5)';
            btn.style.fontWeight = 'bold';
            btn.style.fontFamily = 'Arial, sans-serif';
            btn.style.fontSize = '16px';
            btn.style.transition = 'background 0.3s, transform 0.3s';
            
            btn.onmouseover = () => {
                btn.style.background = '#45a049';
                btn.style.transform = 'scale(1.05)';
            };
            btn.onmouseout = () => {
                btn.style.background = '#4CAF50';
                btn.style.transform = 'scale(1)';
            };
            
            btn.onclick = () => {
               window.location.href = '../index.html';
            };
            
            document.body.appendChild(btn);
          }
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkAndAddButton);
        } else {
          checkAndAddButton();
        }
      })();
    </script>
</body>
</html>
