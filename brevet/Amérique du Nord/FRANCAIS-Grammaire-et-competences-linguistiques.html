<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FRANÇAIS Grammaire et compétences linguistiques</title>
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="manifest" href="../../manifest.json" />
        <link rel="stylesheet" href="../../brevet/code/brevet.css" />
    </head>
    <body>
        <script>
            (async () => {
                async function loadJSON(path) {
                    const res = await fetch(path);
                    if (!res.ok) {
                        throw new Error(
                            "JSON introuvable : " + path +
                            " (statut " + res.status + ")" +
                            "\n👉 Vérifie que le fichier existe au bon chemin."
                        );
                    }
                    const text = await res.text();
                    if (text.trim().length === 0) {
                        throw new Error("Le fichier JSON est vide : " + path);
                    }
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        throw new Error(
                            "Erreur de syntaxe dans le JSON : " + e.message +
                            "\n👉 Si ce fichier a été généré par IA, le JSON est mal formé. " +
                            "Valide-le sur https://jsonlint.com"
                        );
                    }
                }

                try {
                    window.ACTIVE_SUBJECT_JSON = await loadJSON(
                        "json/FRANCAIS-Grammaire-et-competences-linguistiques.json",
                    );
                    const response = await fetch(
                        "../../brevet/code/brevet.html",
                    );
                    const html = await response.text();
                    const doc = new DOMParser().parseFromString(
                        html,
                        "text/html",
                    );
                    document.body.className = doc.body.className;
                    document.body.insertAdjacentHTML(
                        "afterbegin",
                        doc.body.innerHTML,
                    );
                    if (window.lucide) window.lucide.createIcons();

                    if ("serviceWorker" in navigator) {
                        navigator.serviceWorker.register(
                            "../../service-worker.js",
                            { scope: "/" },
                        );
                    }

                    const script = document.createElement("script");
                    script.src = "../../brevet/code/brevet.js";
                    document.body.appendChild(script);
                } catch (err) {
                    console.error("Erreur de chargement :", err.message);
                    document.body.innerHTML = `<div style="padding:2rem;color:#ef4444;font-family:sans-serif;">
                        <h2>❌ Erreur de chargement</h2>
                        <pre style="white-space:pre-wrap;font-size:0.85rem;">${err.message}</pre>
                    </div>`;
                }
            })();
        </script>
    </body>
</html>
