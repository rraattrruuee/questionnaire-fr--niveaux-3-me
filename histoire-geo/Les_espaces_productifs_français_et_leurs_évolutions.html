<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../quiz_icon.svg" type="image/x-icon" />
    <title>Les espaces productifs français et leurs évolutions</title>
    <style>
      /* ----------------------------------------------------
           ANIMATIONS (KEYFRAMES)
           ---------------------------------------------------- */
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      @keyframes headerDrop {
        from {
          opacity: 0;
          transform: translateY(-50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          box-shadow: 0 5px 15px rgba(76, 81, 191, 0.3);
        }
        50% {
          transform: scale(1.02);
          box-shadow: 0 8px 20px rgba(76, 81, 191, 0.5);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 5px 15px rgba(76, 81, 191, 0.3);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes resultsEntry {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-5px);
        }
        60% {
          transform: translateY(-3px);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20%,
        60% {
          transform: translateX(-5px);
        }
        40%,
        80% {
          transform: translateX(5px);
        }
      }

      @keyframes glowCorrect {
        0% {
          box-shadow: 0 0 5px #68d391;
        }
        50% {
          box-shadow: 0 0 20px #48bb78;
        }
        100% {
          box-shadow: 0 0 5px #68d391;
        }
      }

      @keyframes zoomFeedback {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes couleur-qui-change {
        0%,
        10% {
          color: white;
        }
        30% {
          color: #00ff00;
        }
        38% {
          color: #ffff00;
        }
        46% {
          color: #ff00ff;
        }
        54% {
          color: #00ffff;
        }
        60% {
          color: #ffa500;
        }
        68% {
          color: #7cfc00;
        }
        76% {
          color: #ff69b4;
        }
        84% {
          color: #8a2be2;
        }
        92% {
          color: #ff4500;
        }
        100% {
          color: deeppink;
        }
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes flicker {
        0%,
        100% {
          opacity: 1;
        }
        5%,
        25%,
        45%,
        65%,
        85% {
          opacity: 0.85;
        }
        10%,
        30%,
        50%,
        70%,
        90% {
          opacity: 1;
        }
      }

      @keyframes wipe-in {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }

      @keyframes border-fade {
        0% {
          border-color: #3182ce;
        }
        33% {
          border-color: #48bb78;
        }
        66% {
          border-color: #f6ad55;
        }
        100% {
          border-color: #3182ce;
        }
      }

      @keyframes clignotement-leger {
        0%,
        100% {
          color: red;
          opacity: 1;
        }
        50% {
          color: orange;
          opacity: 0.7;
        }
      }

      /* ----------------------------------------------------
           STYLE GÉNÉRAL
           ---------------------------------------------------- */
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f0f4f8;
        padding: 1rem;
        line-height: 1.6;
        min-height: 100vh;
      }

      @media (min-width: 768px) {
        body {
          padding: 2rem;
        }
      }

      .quiz-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #1a202c;
        margin-bottom: 0.5rem;
        animation: headerDrop 0.8s ease-out;
      }

      .header p {
        color: #4a5568;
        font-size: 1.125rem;
        font-weight: 500;
      }

      .question-card {
        min-height: 250px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        border-radius: 15px;
        background-color: #f7faff;
        border: 2px solid #e2e8f0;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }

      .question-card.entering {
        animation: slideIn 0.5s ease-out forwards;
      }

      .question-card.fast-exit {
        animation: slideOut 0.25s ease-in forwards; /* Rapide pour le succès */
      }
      .question-card.slow-exit {
        animation: slideOut 0.8s ease-in forwards; /* Lent pour l'échec */
      }

      .question-text {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: #2d3748;
      }

      .options-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .answer-btn {
        display: block;
        width: 100%;
        padding: 1rem 1.25rem;
        text-align: left;
        border-radius: 10px;
        transition: all 0.2s ease-out;
        font-weight: 600;
        border: 1px solid #c3dafe;
        color: #2b6cb0;
        background-color: #ebf4ff;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .answer-btn:hover:not(.selected):not(.correct):not(.incorrect) {
        background-color: #cee0f2;
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .selected {
        background-color: #3182ce;
        border-color: #2c5282;
        color: white;
        transform: scale(1.01);
        box-shadow: 0 5px 15px rgba(49, 130, 206, 0.4);
      }

      .correct {
        background-color: #48bb78 !important;
        border-color: #2f855a !important;
        color: white !important;
        box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        pointer-events: none;
        animation: bounce 0.6s ease-out;
      }

      .incorrect {
        background-color: #f56565 !important;
        border-color: #c53030 !important;
        color: white !important;
        box-shadow: 0 5px 15px rgba(245, 101, 101, 0.4);
        pointer-events: none;
        animation: shake 0.5s ease-in-out;
      }

      #feedback-area {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 10px;
        font-weight: 600;
        text-align: center;
        animation: zoomFeedback 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      }

      .feedback-correct {
        background-color: #e6fffa;
        color: #38a169;
        border: 1px solid #48bb78;
      }

      .feedback-incorrect {
        background-color: #fff5f5;
        color: #e53e3e;
        border: 1px solid #f56565;
      }
      .main-btn-container {
        margin-top: 2.5rem;
        display: flex;
        justify-content: center;
      }

      #main-btn {
        background-color: #4c51bf;
        color: white;
        padding: 1rem 2.5rem;
        border-radius: 12px;
        font-weight: 800;
        font-size: 1.1rem;
        transition:
          background-color 0.3s,
          transform 0.2s,
          box-shadow 0.3s;
        width: 100%;
        border: none;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(76, 81, 191, 0.3);
      }

      @media (min-width: 768px) {
        #main-btn {
          width: auto;
        }
      }

      #main-btn:hover:not(:disabled) {
        background-color: #3a4294;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(76, 81, 191, 0.4);
      }

      #main-btn:active:not(:disabled) {
        animation: pulse 0.3s ease;
      }

      #main-btn:disabled {
        background-color: #a0aec0;
        cursor: not-allowed;
        box-shadow: none;
      }

      #results {
        margin-top: 2.5rem;
        padding: 2rem;
        background-color: #f0fff4;
        border: 2px solid #68d391;
        border-radius: 15px;
        text-align: center;
      }

      #results.entering {
        animation: resultsEntry 0.6s ease-out forwards;
      }

      .high-score-glow {
        animation: glowCorrect 2s infinite alternate;
      }

      #results h2 {
        font-size: 1.8rem;
        font-weight: 700;
        color: #2f855a;
        margin-bottom: 1rem;
      }

      #score-display {
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: #38a169;
      }

      #feedback-message {
        font-size: 1.1rem;
        color: #4c51bf;
      }

      #results button {
        margin-top: 1.5rem;
        padding: 0.75rem 2rem;
        background-color: #48bb78;
        color: white;
        border-radius: 10px;
        font-weight: 700;
        transition: background-color 0.2s;
        border: none;
        cursor: pointer;
      }

      #results button:hover {
        background-color: #38a169;
      }

      .hidden {
        display: none;
      }

      .couleur-qui-change {
        animation: couleur-qui-change 14s infinite alternate;
        font-weight: bold;
      }

      .anim-rotate {
        animation: rotate 5s linear infinite;
      }

      .anim-flicker {
        animation: flicker 0.15s linear infinite alternate;
      }

      .anim-wipe-in {
        animation: wipe-in 1s ease-out forwards;
      }

      .anim-border-fade {
        border: 3px solid transparent;
        animation: border-fade 3s ease-in-out infinite;
      }

      .clignotant {
        animation: clignotement-leger 1.5s infinite ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="quiz-container anim-border-fade">
      <header class="header">
        <h1>
          Les espaces productifs
          <span class="couleur-qui-change">français</span> et
          <span class="clignotant"> leurs évolutions</span>
        </h1>
        <p>
          Question <span id="current-q-number">1</span> /
          <span id="total-q-number">65</span>
        </p>
      </header>

      <div id="quiz-area" class="anim-wipe-in">
        <div id="current-question-card" class="question-card"></div>

        <div id="feedback-area" class="hidden"></div>

        <div class="main-btn-container">
          <button id="main-btn" onclick="checkAnswerAndProceed()">
            Valider la Réponse
          </button>
        </div>
      </div>

      <div id="results" class="hidden">
        <h2 class="anim-flicker">Quiz Terminé !</h2>
        <p id="score-display"></p>
        <p id="feedback-message"></p>
        <button onclick="restartQuiz()">Recommencer le Quiz</button>
      </div>
    </div>

    <script>
      // --- DATA: ---
      const questions = [
        {
          q: "Qu'est-ce qu'un espace productif ?",
          answers: [
            "Une zone de loisirs uniquement",
            "Une zone où se concentrent des activités produisant des biens et services",
            "Un espace inhabité",
            "Un centre commercial",
          ],
          correct:
            "Une zone où se concentrent des activités produisant des biens et services",
        },
        {
          q: "Quel processus favorise la circulation mondiale des biens, services et capitaux ?",
          answers: [
            "La décentralisation",
            "La mondialisation",
            "L'urbanisation",
            "L'isolement",
          ],
          correct: "La mondialisation",
        },
        {
          q: "Quel pourcentage du PIB français l'agriculture représente-t-elle ?",
          answers: ["2 %", "10 %", "25 %", "50 %"],
          correct: "2 %",
        },
        {
          q: "Quel rang la France occupe-t-elle en Europe pour la production agricole ?",
          answers: ["3e", "10e", "1er", "5e"],
          correct: "1er",
        },
        {
          q: "Quel pourcentage de la population active travaille dans l'agriculture ?",
          answers: ["1.5 %", "5 %", "10 %", "20 %"],
          correct: "1.5 %",
        },
        {
          q: "Où se situent principalement les zones de grandes cultures (blé, maïs) en France ?",
          answers: [
            "Dans les montagnes",
            "Dans les plaines de l'intérieur (Bassin parisien, Beauce, Champagne)",
            "Sur les côtes méditerranéennes",
            "En Bretagne uniquement",
          ],
          correct:
            "Dans les plaines de l'intérieur (Bassin parisien, Beauce, Champagne)",
        },
        {
          q: "Dans quelle partie de la France se situent majoritairement les zones d'élevage ?",
          answers: [
            "Dans l'Est",
            "Dans l'Ouest et le Sud-Ouest",
            "À Paris",
            "Dans le Nord",
          ],
          correct: "Dans l'Ouest et le Sud-Ouest",
        },
        {
          q: "Où se trouvent principalement les zones fruitières et légumières ?",
          answers: [
            "Dans le Sud-Est (PACA) et le Roussillon",
            "En Normandie",
            "Dans les Vosges",
            "Dans le Nord-Pas-de-Calais",
          ],
          correct: "Dans le Sud-Est (PACA) et le Roussillon",
        },
        {
          q: "Que signifie le sigle AOC ?",
          answers: [
            "Agriculture Organique Contrôlée",
            "Appellation d'Origine Contrôlée",
            "Association des Ouvriers Champenois",
            "Alimentation d'Origine Certifiée",
          ],
          correct: "Appellation d'Origine Contrôlée",
        },
        {
          q: "Quel est l'un des effets négatifs de la mondialisation sur l'agriculture française ?",
          answers: [
            "L'augmentation des prix",
            "La concurrence de produits étrangers bon marché",
            "La fin de la mécanisation",
            "L'interdiction d'exporter",
          ],
          correct: "La concurrence de produits étrangers bon marché",
        },
        {
          q: "Comment l'agriculture française a-t-elle augmenté sa productivité ?",
          answers: [
            "En utilisant moins de machines",
            "Par la mécanisation et les produits phytosanitaires",
            "En revenant aux techniques du Moyen-Âge",
            "En réduisant les surfaces cultivées",
          ],
          correct: "Par la mécanisation et les produits phytosanitaires",
        },
        {
          q: "Quelle région est mondialement connue pour son vin effervescent ?",
          answers: ["La Bretagne", "La Champagne", "L'Auvergne", "Le Nord"],
          correct: "La Champagne",
        },
        {
          q: "Quel est le chiffre d'affaires annuel de la production de champagne ?",
          answers: [
            "1 milliard d'euros",
            "6 milliards d'euros",
            "100 millions d'euros",
            "50 milliards d'euros",
          ],
          correct: "6 milliards d'euros",
        },
        {
          q: "Quel pourcentage de la production de champagne est exporté ?",
          answers: ["10 %", "30 %", "60 %", "95 %"],
          correct: "60 %",
        },
        {
          q: "Qu'est-ce que l'œnotourisme ?",
          answers: [
            "Le tourisme lié à la découverte du vin",
            "Le tourisme de haute montagne",
            "Le tourisme dans les musées d'art",
            "Le tourisme spatial",
          ],
          correct: "Le tourisme lié à la découverte du vin",
        },
        {
          q: "Combien de visiteurs annuels la région Grand-Est accueille-t-elle pour l'œnotourisme ?",
          answers: ["1 million", "8 millions", "500 000", "20 millions"],
          correct: "8 millions",
        },
        {
          q: "Vers quels secteurs l'industrie française a-t-elle décliné ?",
          answers: [
            "L'agriculture",
            "Les secteurs tertiaires (services)",
            "La mine",
            "La pêche",
          ],
          correct: "Les secteurs tertiaires (services)",
        },
        {
          q: "Quels étaient les bastions historiques de la sidérurgie et de la mine en France ?",
          answers: [
            "PACA et Corse",
            "Nord-Pas-de-Calais et Lorraine",
            "Bretagne et Normandie",
            "Aquitaine",
          ],
          correct: "Nord-Pas-de-Calais et Lorraine",
        },
        {
          q: "Quel secteur industriel domine la vallée du Rhône ?",
          answers: [
            "Le luxe",
            "L'industrie chimique et pharmaceutique",
            "L'aéronautique",
            "Le bois",
          ],
          correct: "L'industrie chimique et pharmaceutique",
        },
        {
          q: "Dans quels domaines technologiques Grenoble est-elle spécialisée ?",
          answers: [
            "La sidérurgie",
            "La microélectronique et la nanotechnologie",
            "Le textile",
            "La construction navale",
          ],
          correct: "La microélectronique et la nanotechnologie",
        },
        {
          q: "Quels secteurs industriels trouve-t-on principalement en Île-de-France ?",
          answers: [
            "Luxe, mode et technologies de pointe",
            "Mines de charbon",
            "Élevage intensif",
            "Pêche industrielle",
          ],
          correct: "Luxe, mode et technologies de pointe",
        },
        {
          q: "Qu'est-ce qu'une délocalisation ?",
          answers: [
            "Le transfert d'une production vers des pays à bas coûts",
            "L'ouverture d'un nouveau magasin en ville",
            "L'achat de produits locaux",
            "L'augmentation des salaires",
          ],
          correct: "Le transfert d'une production vers des pays à bas coûts",
        },
        {
          q: "Citez un pôle d'innovation français majeur.",
          answers: [
            "Le Mont-Saint-Michel",
            "Minatec (Grenoble)",
            "La Beauce",
            "Les stations de ski",
          ],
          correct: "Minatec (Grenoble)",
        },
        {
          q: "Qu'est-ce qu'un pôle de compétitivité ?",
          answers: [
            "Un stade de foot",
            "Un regroupement d'entreprises, labos et universités pour l'innovation",
            "Une zone commerciale",
            "Un syndicat d'agriculteurs",
          ],
          correct:
            "Un regroupement d'entreprises, labos et universités pour l'innovation",
        },
        {
          q: "Pourquoi la géographie de Grenoble est-elle attractive pour les talents ?",
          answers: [
            "C'est une ville de bord de mer",
            "À cause du climat désertique",
            "Cadre de vie unique entre montagnes (Alpes) et technologie",
            "Proximité avec l'Allemagne",
          ],
          correct: "Cadre de vie unique entre montagnes (Alpes) et technologie",
        },
        {
          q: "Quelles stations de ski sont proches de Grenoble ?",
          answers: [
            "Courchevel",
            "Chamrousse et les 7 Laux",
            "Chamonix",
            "La Mongie",
          ],
          correct: "Chamrousse et les 7 Laux",
        },
        {
          q: "Quel secteur est le plus vaste en termes d'emplois en France ?",
          answers: [
            "L'agriculture",
            "L'industrie",
            "Le tertiaire (services)",
            "Le secteur minier",
          ],
          correct: "Le tertiaire (services)",
        },
        {
          q: "Quel est le rang de la France pour le tourisme mondial ?",
          answers: [
            "1ère destination mondiale",
            "5e destination mondiale",
            "10e destination mondiale",
            "20e destination mondiale",
          ],
          correct: "1ère destination mondiale",
        },
        {
          q: "Quel est le plus grand quartier d'affaires d'Europe ?",
          answers: [
            "La City à Londres",
            "La Défense à Paris",
            "Euralille",
            "Part-Dieu à Lyon",
          ],
          correct: "La Défense à Paris",
        },
        {
          q: "Où se concentrent principalement les activités tertiaires ?",
          answers: [
            "Dans les villages isolés",
            "Dans les grandes agglomérations urbaines",
            "Dans les forêts",
            "Uniquement sur les côtes",
          ],
          correct: "Dans les grandes agglomérations urbaines",
        },
        {
          q: "Combien de visiteurs attire le Mont-Saint-Michel chaque année ?",
          answers: ["1 million", "3.5 millions", "10 millions", "100 000"],
          correct: "3.5 millions",
        },
        {
          q: "Quel organisme a classé le Mont-Saint-Michel ?",
          answers: ["L'ONU", "L'UNESCO", "L'UNICEF", "L'OMC"],
          correct: "L'UNESCO",
        },
        {
          q: "Quel aménagement a été inauguré en 2014 au Mont-Saint-Michel ?",
          answers: [
            "Un aéroport",
            "Une passerelle piétonne",
            "Une autoroute",
            "Un tunnel sous-marin",
          ],
          correct: "Une passerelle piétonne",
        },
        {
          q: "Pourquoi a-t-on supprimé les routes goudronnées menant au Mont-Saint-Michel ?",
          answers: [
            "Pour construire des maisons",
            "Pour restaurer l'isolement naturel et lutter contre l'envasement",
            "Parce qu'elles étaient trop vieilles",
            "Pour empêcher les gens de venir",
          ],
          correct:
            "Pour restaurer l'isolement naturel et lutter contre l'envasement",
        },
        {
          q: "Où a-t-on déplacé les parkings au Mont-Saint-Michel ?",
          answers: [
            "À l'intérieur de l'abbaye",
            "Sur le continent, à proximité",
            "Sur l'île voisine",
            "Ils ont été supprimés",
          ],
          correct: "Sur le continent, à proximité",
        },
        {
          q: "Qu'est-ce qu'un quartier d'affaires ?",
          answers: [
            "Une zone résidentielle",
            "Une zone urbaine concentrant des services financiers et commerciaux",
            "Un marché de quartier",
            "Une usine de textile",
          ],
          correct:
            "Une zone urbaine concentrant des services financiers et commerciaux",
        },
        {
          q: "Quel pays est un marché clé pour l'exportation du champagne en Asie ?",
          answers: ["Inde", "Chine et Japon", "Thaïlande", "Vietnam"],
          correct: "Chine et Japon",

      let currentQuestionIndex = 0;
      let score = 0;
      let userSelection = null;
      let questionsShuffled = [];
      let quizInProgress = false;

      // Fonction pour mélanger un tableau (Algorithme de Fisher-Yates)
      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      // Affiche la question actuelle
      function renderQuestion() {
        if (currentQuestionIndex >= questionsShuffled.length) {
          showResults();
          return;
        }

        const q = questionsShuffled[currentQuestionIndex];
        const card = document.getElementById("current-question-card");
        const questionNumber = currentQuestionIndex + 1;

        card.classList.remove("slow-exit", "fast-exit");
        card.classList.add("entering");

        document.getElementById("current-q-number").textContent =
          questionNumber;
        document.getElementById("total-q-number").textContent =
          questionsShuffled.length;
        document.getElementById("main-btn").textContent = "Valider la Réponse";
        document.getElementById("main-btn").disabled = true;

        card.innerHTML = `
                      <p class="question-text">${q.q}</p>
                      <div id="options-container" class="options-container">
                          <!-- Options de réponse -->
                      </div>
                  `;

        document.getElementById("feedback-area").classList.add("hidden");
        document
          .getElementById("feedback-area")
          .classList.remove("feedback-correct", "feedback-incorrect");
        userSelection = null;
        quizInProgress = true;

        const optionsContainer = card.querySelector("#options-container");
        const shuffledAnswers = shuffle([...q.answers]);

        shuffledAnswers.forEach((answer) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer-btn";
          button.setAttribute("data-answer", answer);
          button.textContent = answer;
          button.onclick = function () {
            selectAnswer(answer, button);
          };
          optionsContainer.appendChild(button);
        });

        setTimeout(() => {
          card.classList.remove("entering");
        }, 500);
      }

      function selectAnswer(answer, clickedButton) {
        if (!quizInProgress) return;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.querySelectorAll(".answer-btn").forEach((btn) => {
          btn.classList.remove("selected");
        });

        clickedButton.classList.add("selected");

        userSelection = answer;
        document.getElementById("main-btn").disabled = false;
      }

      function checkAnswerAndProceed() {
        if (userSelection === null || !quizInProgress) return;

        quizInProgress = false;
        document.getElementById("main-btn").disabled = true;

        const q = questionsShuffled[currentQuestionIndex];
        const isCorrect = userSelection === q.correct;
        const feedbackArea = document.getElementById("feedback-area");
        const optionsContainer = document.getElementById("options-container");
        const card = document.getElementById("current-question-card");

        feedbackArea.classList.remove("hidden");

        optionsContainer.querySelectorAll(".answer-btn").forEach((btn) => {
          const answer = btn.getAttribute("data-answer");
          btn.classList.remove("selected");

          if (answer === q.correct) {
            btn.classList.add("correct");
          } else if (answer === userSelection && !isCorrect) {
            btn.classList.add("incorrect");
          }
        });

        feedbackArea.classList.remove("feedback-correct", "feedback-incorrect");

        if (isCorrect) {
          score++;
          feedbackArea.textContent =
            "Bravo ! Réponse correcte. Prochaine question rapidement !";
          feedbackArea.classList.add("feedback-correct");
          card.classList.add("fast-exit");
        } else {
          feedbackArea.textContent = `Faux. La bonne réponse était : ${q.correct}. Prenez le temps de réfléchir.`;
          feedbackArea.classList.add("feedback-incorrect");
          card.classList.add("slow-exit");
        }

        // Déterminer la durée du délai de transition
        const delayDuration = isCorrect ? 500 : 3000;

        document.getElementById("main-btn").textContent = "Question Suivante";

        setTimeout(() => {
          currentQuestionIndex++;

          if (currentQuestionIndex >= questionsShuffled.length) {
            document.getElementById("main-btn").textContent =
              "Voir les Résultats";
            document.getElementById("main-btn").onclick = showResults;
            document.getElementById("main-btn").disabled = false;
          } else {
            renderQuestion();
            document.getElementById("main-btn").onclick = checkAnswerAndProceed;
          }
        }, delayDuration);
      }

      function showResults() {
        document.getElementById("quiz-area").classList.add("hidden");
        const resultsDiv = document.getElementById("results");
        const totalQuestions = questionsShuffled.length;
        const percentage = Math.round((score / totalQuestions) * 100);

        document.getElementById("score-display").textContent =
          `Votre score final est de ${score} / ${totalQuestions} (${percentage}%)`;

        let feedbackMsg = "";
        resultsDiv.classList.remove("high-score-glow");

        if (percentage === 100) {
          feedbackMsg =
            "Félicitations ! Maîtrise parfaite de la génétique. Vous êtes prêt(e) !";
          resultsDiv.classList.add("high-score-glow");
        } else if (percentage >= 80) {
          feedbackMsg =
            "Excellent travail ! Vous avez une très bonne compréhension des notions.";
          resultsDiv.classList.add("high-score-glow");
        } else if (percentage >= 60) {
          feedbackMsg =
            "Bon effort ! Revoyez les thèmes où vous avez eu le plus d'erreurs.";
        } else {
          feedbackMsg =
            "N'abandonnez pas. Reprenez les sections I, III et V de votre fiche pour consolider les bases.";
        }
        document.getElementById("feedback-message").textContent = feedbackMsg;
        resultsDiv.classList.remove("hidden");

        resultsDiv.classList.add("entering");

        setTimeout(() => {
          resultsDiv.scrollIntoView({ behavior: "smooth" });
        }, 100);
      }

      function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        userSelection = null;
        questionsShuffled = shuffle([...questions]);
        document.getElementById("quiz-area").classList.remove("hidden");

        const resultsDiv = document.getElementById("results");
        resultsDiv.classList.add("hidden");
        resultsDiv.classList.remove("entering", "high-score-glow");

        document.getElementById("main-btn").onclick = checkAnswerAndProceed;
        renderQuestion();
      }

      window.onload = function () {
        document.getElementById("total-q-number").textContent =
          questions.length;
        questionsShuffled = shuffle([...questions]);
        renderQuestion();
      };
