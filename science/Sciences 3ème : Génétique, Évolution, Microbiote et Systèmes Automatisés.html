<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../quiz_icon.svg" type="image/x-icon" />
    <title>
      Sciences 3ème : Génétique, Évolution, Microbiote et Systèmes Automatisés
    </title>
    <style>
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }

        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      @keyframes headerDrop {
        from {
          opacity: 0;
          transform: translateY(-50px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }

        40% {
          transform: translateY(-5px);
        }

        60% {
          transform: translateY(-3px);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }

        20%,
        60% {
          transform: translateX(-5px);
        }

        40%,
        80% {
          transform: translateX(5px);
        }
      }

      @keyframes zoomFeedback {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }

        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes couleur-qui-change {
        0%,
        10% {
          color: white;
        }

        30% {
          color: #00ff00;
        }

        38% {
          color: #ffff00;
        }

        46% {
          color: #ff00ff;
        }

        54% {
          color: #00ffff;
        }

        60% {
          color: #ffa500;
        }

        68% {
          color: #7cfc00;
        }

        76% {
          color: #ff69b4;
        }

        84% {
          color: #8a2be2;
        }

        92% {
          color: #ff4500;
        }

        100% {
          color: deeppink;
        }
      }

      @keyframes wipe-in {
        from {
          clip-path: inset(0 100% 0 0);
        }

        to {
          clip-path: inset(0 0 0 0);
        }
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f0f4f8;
        padding: 1rem;
        line-height: 1.6;
        min-height: 100vh;
      }

      .quiz-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        overflow: hidden;
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #1a202c;
        animation: headerDrop 0.8s ease-out;
      }

      .progress-bar-container {
        width: 100%;
        height: 8px;
        background-color: #edf2f7;
        border-radius: 4px;
        margin-bottom: 20px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #4c51bf, #667eea);
        width: 0%;
        transition: width 0.4s ease-out;
      }

      .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        animation: slideIn 0.6s ease-out;
      }

      .nav-btn {
        display: block;
        width: 100%;
        padding: 1.5rem;
        text-align: center;
        border-radius: 15px;
        transition: all 0.2s;
        font-weight: 700;
        border: 2px solid #c3dafe;
        color: #2b6cb0;
        background-color: #ebf4ff;
        cursor: pointer;
        box-sizing: border-box;
      }

      .nav-btn:hover {
        background-color: #cee0f2;
        transform: translateY(-3px);
        border-color: #4c51bf;
      }

      .question-card {
        min-height: 200px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        border-radius: 15px;
        background-color: #f7faff;
        border: 2px solid #e2e8f0;
        opacity: 0;
        transform: translateY(20px);
      }

      .question-card.entering {
        animation: slideIn 0.5s ease-out forwards;
      }

      .question-card.fast-exit {
        animation: slideOut 0.3s ease-in forwards;
      }

      .question-text {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: #2d3748;
      }

      .img-container {
        text-align: center;
        margin: 15px 0;
      }

      .img-container img {
        max-width: 100%;
        border-radius: 8px;
      }

      .options-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .option-item {
        position: relative;
      }

      .option-item input[type="radio"] {
        position: absolute;
        opacity: 0;
        height: 0;
        width: 0;
      }

      .answer-btn {
        display: block;
        width: 100%;
        padding: 1rem 1.25rem;
        text-align: left;
        border-radius: 10px;
        transition: all 0.2s;
        font-weight: 600;
        border: 1px solid #c3dafe;
        color: #2b6cb0;
        background-color: #ebf4ff;
        cursor: pointer;
        box-sizing: border-box;
      }

      .answer-btn:hover {
        background-color: #cee0f2;
        transform: translateY(-1px);
      }

      .option-item input:checked + .answer-btn {
        background-color: #3182ce;
        border-color: #2c5282;
        color: white;
      }

      .answer-btn.correct {
        background-color: #48bb78 !important;
        border-color: #2f855a !important;
        color: white !important;
        animation: bounce 0.6s ease-out;
      }

      .answer-btn.incorrect {
        background-color: #f56565 !important;
        border-color: #c53030 !important;
        color: white !important;
        animation: shake 0.5s ease-in-out;
      }

      .text-input-styled {
        width: 100%;
        padding: 1rem 1.25rem;
        font-size: 1.1rem;
        border: 2px solid #c3dafe;
        border-radius: 10px;
        box-sizing: border-box;
      }

      .text-input-styled.correct {
        border-color: #48bb78;
        background-color: #f0fff4;
        color: #2f855a;
        animation: bounce 0.6s ease-out;
      }

      .text-input-styled.incorrect {
        border-color: #f56565;
        background-color: #fff5f5;
        color: #c53030;
        animation: shake 0.5s ease-in-out;
      }

      #feedback-area {
        margin-top: 1rem;
        padding: 1.5rem;
        border-radius: 10px;
        font-weight: 500;
        display: none;
        opacity: 0;
      }

      #feedback-area.visible {
        display: block;
        animation: zoomFeedback 0.4s forwards;
      }

      .feedback-correct {
        background-color: #e6fffa;
        color: #276749;
        border: 1px solid #48bb78;
      }

      .feedback-incorrect {
        background-color: #fff5f5;
        color: #c53030;
        border: 1px solid #f56565;
      }

      .main-btn-container {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
      }

      #main-btn {
        background-color: #4c51bf;
        color: white;
        padding: 1rem 2.5rem;
        border-radius: 12px;
        font-weight: 800;
        font-size: 1.1rem;
        transition: all 0.3s;
        width: 100%;
        border: none;
        cursor: pointer;
      }

      #main-btn:disabled {
        background-color: #a0aec0;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .math-frac {
        display: inline-block;
        vertical-align: middle;
        text-align: center;
        font-size: 0.9em;
      }

      .math-num {
        border-bottom: 1px solid;
        display: block;
        padding: 0 2px;
      }

      .math-den {
        display: block;
        padding: 0 2px;
      }

      .couleur-qui-change {
        animation: couleur-qui-change 14s infinite alternate;
        font-weight: bold;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div class="quiz-container">
      <div class="header">
        <h1>
          Sciences 3ème : Génétique, Évolution, Microbiote et Systèmes
          Automatisés
        </h1>
        <p class="anim-wipe-in">Troisième - QCM Aléatoire</p>
      </div>
      <div id="nav-container" class="nav-grid"></div>

      <div id="quiz-ui" class="hidden">
        <div class="progress-bar-container">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            color: #a0aec0;
            font-size: 0.9em;
            margin-bottom: 10px;
            font-weight: 600;
          "
        >
          <span id="cat-label">CATÉGORIE</span>
          <span id="counter-label">1/10</span>
        </div>

        <div id="question-card-container" class="question-card entering">
          <div id="question-text" class="question-text"></div>
          <div id="image-area" class="img-container hidden"></div>

          <div id="input-area"></div>
        </div>

        <div id="feedback-area"></div>

        <div class="main-btn-container">
          <button id="main-btn" onclick="app.checkAnswer()">
            Valider la réponse
          </button>
        </div>
      </div>
    </div>

    <script>
      const db = [
        {
          category: "Diversité et stabilité génétique",
          questions: [
            {
              text: "Où est localisée l'information génétique dans une cellule eucaryote ?",
              type: "mcq",
              options: [
                "Dans le cytoplasme",
                "Dans le noyau",
                "Dans la membrane plasmique",
                "Dans les mitochondries",
              ],
              correct: 1,
              solution:
                "L'information génétique est contenue dans le noyau de la cellule, plus précisément dans les chromosomes composés d'ADN.",
            },
            {
              text: "Quand une cellule n'est pas en division, sous quelle forme se trouve l'ADN ?",
              type: "mcq",
              options: [
                "En chromosomes visibles",
                "En bâtonnets condensés",
                "Déroulé et non visible",
                "Sous forme de protéines",
              ],
              correct: 2,
              solution:
                "Lorsqu'une cellule n'est pas en division, l'ADN est déroulé dans le noyau et les chromosomes ne sont pas visibles au microscope.",
            },
            {
              text: "Combien de paires de chromosomes possède l'espèce humaine ?",
              type: "mcq",
              options: ["22 paires", "23 paires", "24 paires", "46 paires"],
              correct: 1,
              solution:
                "L'espèce humaine possède 23 paires de chromosomes, soit 46 chromosomes au total.",
            },
            {
              text: "Quel est le caryotype sexuel d'une fille humaine ?",
              type: "mcq",
              options: ["XY", "XX", "YY", "XO"],
              correct: 1,
              solution:
                "Les filles humaines possèdent deux chromosomes sexuels X, notés XX.",
            },
            {
              text: "Quel est le caryotype sexuel d'un garçon humain ?",
              type: "mcq",
              options: ["XX", "XY", "YY", "XO"],
              correct: 1,
              solution:
                "Les garçons humains possèdent un chromosome X et un chromosome Y, notés XY.",
            },
            {
              text: "Quel syndrome est provoqué par la présence d'un chromosome supplémentaire sur la paire 21 ?",
              type: "mcq",
              options: [
                "Syndrome de Turner",
                "Syndrome de Down",
                "Syndrome de Klinefelter",
                "Syndrome de Williams",
              ],
              correct: 1,
              solution:
                "Le syndrome de Down (ou trisomie 21) est causé par la présence d'un troisième chromosome sur la paire 21.",
            },
            {
              text: "Combien de paires de chromosomes possède la drosophile ?",
              type: "mcq",
              options: ["2 paires", "4 paires", "8 paires", "23 paires"],
              correct: 1,
              solution:
                "La drosophile, mouche utilisée en génétique, possède 4 paires de chromosomes.",
            },
            {
              text: "Qu'est-ce qu'un caryotype ?",
              type: "mcq",
              options: [
                "L'ensemble des protéines d'une cellule",
                "L'ensemble des chromosomes d'une cellule classés par paire",
                "La forme d'une cellule",
                "Le nombre de gènes d'un individu",
              ],
              correct: 1,
              solution:
                "Un caryotype est la représentation organisée de l'ensemble des chromosomes d'une cellule, classés par paire selon leur taille et leur forme.",
            },
            {
              text: "Deux individus appartiennent à la même espèce si :",
              type: "mcq",
              options: [
                "Ils ont le même nombre de chromosomes",
                "Ils peuvent se reproduire et engendrer une descendance fertile",
                "Ils vivent dans le même milieu",
                "Ils ont la même apparence",
              ],
              correct: 1,
              solution:
                "La définition biologique d'une espèce repose sur la capacité des individus à se reproduire entre eux et à produire une descendance fertile.",
            },
            {
              text: "Quelle est la définition de l'ADN ?",
              type: "mcq",
              options: [
                "Une protéine structurale",
                "Une longue molécule portant l'information génétique",
                "Un type de chromosome",
                "Une enzyme de digestion",
              ],
              correct: 1,
              solution:
                "L'ADN (acide désoxyribonucléique) est une longue molécule qui porte l'information génétique et qui, en se condensant, forme les chromosomes.",
            },
          ],
        },
        {
          category: "Chromosomes et division cellulaire",
          questions: [
            {
              text: "Que deviennent les chromosomes lors de la division cellulaire ?",
              type: "mcq",
              options: [
                "Ils disparaissent",
                "Ils se condensent et deviennent visibles",
                "Ils se transforment en ARN",
                "Ils migrent hors du noyau",
              ],
              correct: 1,
              solution:
                "Lors de la division cellulaire, l'ADN se condense pour former des chromosomes en forme de bâtonnets, visibles au microscope.",
            },
            {
              text: "Avant de se diviser, que fait une cellule avec son ADN ?",
              type: "mcq",
              options: [
                "Elle le détruit",
                "Elle le copie",
                "Elle le transforme en protéines",
                "Elle l'exporte hors du noyau",
              ],
              correct: 1,
              solution:
                "Avant la division, la cellule réalise une copie exacte de ses molécules d'ADN pour que chaque cellule fille reçoive un jeu complet de chromosomes.",
            },
            {
              text: "Lors de la mitose, comment se répartissent les chromosomes ?",
              type: "mcq",
              options: [
                "Au hasard entre les cellules filles",
                "Les deux chromatides de chaque chromosome se séparent vers chaque cellule fille",
                "Tous vont dans une seule cellule",
                "Ils disparaissent",
              ],
              correct: 1,
              solution:
                "Lors de la mitose, les deux chromatides de chaque chromosome dupliqué se séparent et migrent vers chacune des deux cellules filles, assurant ainsi l'identité du caryotype.",
            },
            {
              text: "Combien de cellules filles produit une mitose ?",
              type: "mcq",
              options: ["1", "2", "4", "8"],
              correct: 1,
              solution:
                "La mitose est une division cellulaire qui produit deux cellules filles génétiquement identiques à la cellule mère.",
            },
            {
              text: "Quelle est la fonction principale de la mitose ?",
              type: "mcq",
              options: [
                "Produire des gamètes",
                "Assurer la croissance et le renouvellement des cellules",
                "Créer de la diversité génétique",
                "Réduire le nombre de chromosomes",
              ],
              correct: 1,
              solution:
                "La mitose permet la croissance de l'organisme et le renouvellement des cellules usées, en produisant des cellules identiques.",
            },
            {
              text: "Qu'est-ce qu'une chromatide ?",
              type: "mcq",
              options: [
                "Un chromosome entier",
                "Une des deux copies identiques d'un chromosome dupliqué",
                "Un type d'ADN",
                "Une protéine du noyau",
              ],
              correct: 1,
              solution:
                "Après duplication de l'ADN, chaque chromosome est constitué de deux chromatides identiques reliées par un centromère.",
            },
            {
              text: "Si une cellule possède 46 chromosomes avant la mitose, combien en aura chaque cellule fille après ?",
              type: "mcq",
              options: ["23", "46", "92", "Variable"],
              correct: 1,
              solution:
                "La mitose conserve le nombre de chromosomes : chaque cellule fille reçoit 46 chromosomes, identiques à ceux de la cellule mère.",
            },
            {
              text: "Quelle phase précède toujours la mitose dans le cycle cellulaire ?",
              type: "mcq",
              options: [
                "La méiose",
                "L'interphase avec duplication de l'ADN",
                "La fécondation",
                "La différenciation",
              ],
              correct: 1,
              solution:
                "Avant la mitose, la cellule passe par l'interphase, période durant laquelle l'ADN est dupliqué pour préparer la division.",
            },
            {
              text: "Que se passe-t-il si la duplication de l'ADN est incomplète avant la mitose ?",
              type: "mcq",
              options: [
                "Rien, la mitose compense",
                "Les cellules filles auront un caryotype anormal",
                "La cellule meurt immédiatement",
                "Les chromosomes se réparent automatiquement",
              ],
              correct: 1,
              solution:
                "Une duplication incomplète de l'ADN peut entraîner des anomalies chromosomiques dans les cellules filles, potentiellement graves pour l'organisme.",
            },
            {
              text: "La stabilité du caryotype au cours des divisions cellulaires est assurée par :",
              type: "mcq",
              options: [
                "La duplication de l'ADN suivie d'une répartition équitable",
                "Le hasard",
                "La destruction des vieux chromosomes",
                "L'apport externe d'ADN",
              ],
              correct: 0,
              solution:
                "La duplication préalable de l'ADN et la séparation précise des chromatides lors de la mitose garantissent que chaque cellule fille reçoit un caryotype complet et identique.",
            },
          ],
        },
        {
          category: "Gènes, allèles et hérédité",
          questions: [
            {
              text: "Qu'est-ce qu'un gène ?",
              type: "mcq",
              options: [
                "Une protéine du noyau",
                "Un fragment d'ADN à l'origine d'un ou plusieurs caractères",
                "Un chromosome entier",
                "Un type de cellule",
              ],
              correct: 1,
              solution:
                "Un gène est un fragment d'ADN qui contient l'information nécessaire à l'expression d'un ou plusieurs caractères héréditaires.",
            },
            {
              text: "Qu'est-ce qu'un allèle ?",
              type: "mcq",
              options: [
                "Un chromosome sexuel",
                "Une version différente d'un même gène",
                "Une maladie génétique",
                "Un type de division cellulaire",
              ],
              correct: 1,
              solution:
                "Un allèle est une version particulière d'un gène. Par exemple, pour le gène de la couleur des yeux, il existe un allèle 'marron' et un allèle 'bleu'.",
            },
            {
              text: "Combien d'allèles d'un même gène possède un individu pour un chromosome autosomique ?",
              type: "mcq",
              options: ["1", "2", "23", "46"],
              correct: 1,
              solution:
                "Comme les chromosomes existent en paires, un individu possède deux allèles pour chaque gène situé sur un chromosome autosomique (un hérité de chaque parent).",
            },
            {
              text: "Qu'est-ce qu'un allèle dominant ?",
              type: "mcq",
              options: [
                "Un allèle qui s'exprime même s'il n'est présent qu'en un seul exemplaire",
                "Un allèle qui ne s'exprime jamais",
                "Un allèle présent uniquement chez les mâles",
                "Un allèle qui provoque une maladie",
              ],
              correct: 0,
              solution:
                "Un allèle dominant s'exprime et détermine le caractère observable même lorsqu'il n'est présent qu'en un seul exemplaire (associé à un allèle récessif).",
            },
            {
              text: "Qu'est-ce qu'un allèle récessif ?",
              type: "mcq",
              options: [
                "Un allèle qui s'exprime toujours",
                "Un allèle qui ne s'exprime que s'il est présent en deux exemplaires",
                "Un allèle présent uniquement chez les femelles",
                "Un allèle qui disparaît avec l'âge",
              ],
              correct: 1,
              solution:
                "Un allèle récessif ne s'exprime phénotypiquement que lorsqu'il est présent en deux exemplaires (homozygotie récessive).",
            },
            {
              text: "Pour le gène de la couleur des yeux, si l'allèle marron est dominant sur l'allèle bleu, quel sera le phénotype d'un individu avec un allèle marron et un allèle bleu ?",
              type: "mcq",
              options: [
                "Yeux bleus",
                "Yeux marrons",
                "Yeux verts",
                "Un œil de chaque couleur",
              ],
              correct: 1,
              solution:
                "L'allèle marron étant dominant, il s'exprime même en présence d'un allèle bleu. L'individu aura donc les yeux marrons.",
            },
            {
              text: "Qu'est-ce que le génotype d'un individu ?",
              type: "mcq",
              options: [
                "L'ensemble de ses caractères visibles",
                "L'ensemble de ses allèles",
                "Son caryotype uniquement",
                "Son groupe sanguin",
              ],
              correct: 1,
              solution:
                "Le génotype est l'ensemble des allèles possédés par un individu pour l'ensemble de ses gènes.",
            },
            {
              text: "Qu'est-ce que le phénotype d'un individu ?",
              type: "mcq",
              options: [
                "L'ensemble de ses gènes",
                "L'ensemble de ses caractères observables",
                "Son caryotype",
                "Son environnement",
              ],
              correct: 1,
              solution:
                "Le phénotype correspond à l'ensemble des caractères observables d'un individu, résultant de l'expression de son génotype et de l'influence de l'environnement.",
            },
            {
              text: "Pour le gène des groupes sanguins ABO, combien existe-t-il d'allèles principaux ?",
              type: "mcq",
              options: ["2", "3", "4", "6"],
              correct: 1,
              solution:
                "Il existe trois allèles principaux pour le gène ABO : A, B et O. Chaque individu en possède deux.",
            },
            {
              text: "Si un individu a reçu un allèle A d'un parent et un allèle O de l'autre, quel sera son groupe sanguin ?",
              type: "mcq",
              options: ["Groupe A", "Groupe B", "Groupe AB", "Groupe O"],
              correct: 0,
              solution:
                "L'allèle A est dominant sur l'allèle O. Un individu avec le génotype [A,O] aura donc le phénotype groupe sanguin A.",
            },
          ],
        },
        {
          category: "Méiose et fécondation",
          questions: [
            {
              text: "Qu'est-ce que la méiose ?",

      const app = {
        state: {
          catIdx: 0,
          qIdx: 0,
        },

        init: function () {
          this.renderMenu();
        },

        renderMenu: function () {
          const nav = document.getElementById("nav-container");
          nav.innerHTML = "";
          document.getElementById("quiz-ui").classList.add("hidden");
          document.getElementById("nav-container").classList.remove("hidden");

          db.forEach((cat, idx) => {
            const btn = document.createElement("div");
            btn.className = "nav-btn";
            btn.textContent = cat.category;
            btn.onclick = () => this.startCategory(idx);
            nav.appendChild(btn);
          });
        },

        startCategory: function (idx) {
          this.state.catIdx = idx;
          this.state.qIdx = 0;

          document.getElementById("nav-container").classList.add("hidden");
          document.getElementById("quiz-ui").classList.remove("hidden");
          this.renderQuestion();
        },

        renderQuestion: function () {
          const q = db[this.state.catIdx].questions[this.state.qIdx];
          const card = document.getElementById("question-card-container");
          const feedback = document.getElementById("feedback-area");
          const btn = document.getElementById("main-btn");

          card.classList.remove("fast-exit", "entering");
          void card.offsetWidth;
          card.classList.add("entering");

          feedback.className = "";
          feedback.classList.remove("visible");
          feedback.style.display = "none";

          btn.textContent = "Valider la réponse";
          btn.disabled = false;
          btn.style.backgroundColor = "#4c51bf";

          document.getElementById("cat-label").textContent =
            db[this.state.catIdx].category;
          document.getElementById("counter-label").textContent =
            `${this.state.qIdx + 1} / ${db[this.state.catIdx].questions.length}`;
          document.getElementById("question-text").innerHTML = q.text;

          const imgArea = document.getElementById("image-area");
          if (q.image) {
            imgArea.innerHTML = `<img src="${q.image}">`;
            imgArea.classList.remove("hidden");
          } else {
            imgArea.classList.add("hidden");
          }

          const pct =
            (this.state.qIdx / db[this.state.catIdx].questions.length) * 100;
          document.getElementById("progress-fill").style.width = pct + "%";

          const inputArea = document.getElementById("input-area");
          inputArea.innerHTML = "";

          if (q.type === "mcq") {
            const container = document.createElement("div");
            container.className = "options-container";

            let mixedOptions = q.options.map((optText, originalIndex) => {
              return { text: optText, val: originalIndex };
            });

            mixedOptions.sort(() => Math.random() - 0.5);

            mixedOptions.forEach((optObj, i) => {
              const item = document.createElement("div");
              item.className = "option-item";
              item.innerHTML = `
                              <input type="radio" name="quiz-opt" id="opt-${i}" value="${optObj.val}">
                              <label class="answer-btn" for="opt-${i}">${optObj.text}</label>
                          `;
              container.appendChild(item);
            });
            inputArea.appendChild(container);
          } else {
            inputArea.innerHTML = `<input type="text" id="text-answer" class="text-input-styled" placeholder="Ta réponse..." autocomplete="off">`;
            document
              .getElementById("text-answer")
              .addEventListener("keypress", (e) => {
                if (e.key === "Enter") this.checkAnswer();
              });
            setTimeout(
              () => document.getElementById("text-answer").focus(),
              100,
            );
          }
        },

        checkAnswer: function () {
          const q = db[this.state.catIdx].questions[this.state.qIdx];
          const feedback = document.getElementById("feedback-area");
          feedback.style.display = "block";
          const btn = document.getElementById("main-btn");
          let isCorrect = false;
          let userElement = null;

          if (q.type === "mcq") {
            const selected = document.querySelector(
              'input[name="quiz-opt"]:checked',
            );
            if (!selected) return alert("Choisis une réponse !");

            const label = document.querySelector(`label[for="${selected.id}"]`);
            userElement = label;

            if (parseInt(selected.value) === q.correct) {
              isCorrect = true;
            }
          } else {
            const input = document.getElementById("text-answer");
            if (!input.value.trim()) return alert("Écris une réponse !");
            userElement = input;

            const val = input.value
              .toLowerCase()
              .replace(/\s/g, "")
              .replace(",", ".");
            const accepted = q.accepted.map((a) =>
              a.toLowerCase().replace(/\s/g, "").replace(",", "."),
            );
            if (accepted.includes(val)) isCorrect = true;
          }

          btn.disabled = true;

          if (isCorrect) {
            userElement.classList.add("correct");
            feedback.className = "feedback-correct visible";
            feedback.innerHTML = `
                          <div style="font-size: 1.2em; margin-bottom: 5px;">✅ <span class="couleur-qui-change">Excellent !</span></div>
                          <div>${q.solution}</div>
                      `;
            btn.style.backgroundColor = "#48bb78";
            btn.textContent = "Bravo !";
          } else {
            userElement.classList.add("incorrect");

            if (q.type === "mcq") {
              const correctInput = document.querySelector(
                `input[name="quiz-opt"][value="${q.correct}"]`,
              );
              if (correctInput) {
                const correctLabel = document.querySelector(
                  `label[for="${correctInput.id}"]`,
                );
                correctLabel.classList.add("correct");
              }
            }

            feedback.className = "feedback-incorrect visible";
            feedback.innerHTML = `
                          <div style="font-size: 1.2em; margin-bottom: 5px;">❌ Aïe... Regarde la correction :</div>
                          <div><strong>${q.solution}</strong></div>
                      `;
            btn.style.backgroundColor = "#c53030";
            btn.textContent = "Lecture correction...";
          }

          const pct =
            ((this.state.qIdx + 1) / db[this.state.catIdx].questions.length) *
            100;
          document.getElementById("progress-fill").style.width = pct + "%";

          const delayDuration = isCorrect ? 1200 : 4000;

          setTimeout(() => {
            this.handleTransition();
          }, delayDuration);
        },

        handleTransition: function () {
          if (this.state.qIdx >= db[this.state.catIdx].questions.length - 1) {
            alert("Série terminée ! Retour au menu.");
            this.renderMenu();
            return;
          }

          const card = document.getElementById("question-card-container");
          card.classList.remove("entering");
          card.classList.add("fast-exit");

          setTimeout(() => {
            this.state.qIdx++;
            this.renderQuestion();
          }, 300);
        },
      };

      window.onload = () => app.init();
    </script>
  
    

    <!-- BOUTON RETOUR PWA -->
    <script>
      (function() {
        const checkAndAddButton = () => {
          const isPWA = window.matchMedia('(display-mode: standalone)').matches || 
                        window.matchMedia('(display-mode: fullscreen)').matches || 
                        navigator.standalone;
          
          if (isPWA && !window.location.pathname.endsWith('index.html')) {
            const btn = document.createElement('button');
            btn.innerHTML = '← Retour';
            btn.style.position = 'fixed';
            btn.style.top = '15px';
            btn.style.left = '15px';
            btn.style.zIndex = '9999';
            btn.style.background = '#4CAF50';
            btn.style.color = 'white';
            btn.style.border = 'none';
            btn.style.padding = '10px 20px';
            btn.style.borderRadius = '8px';
            btn.style.cursor = 'pointer';
            btn.style.boxShadow = '0 4px 10px rgba(0,0,0,0.5)';
            btn.style.fontWeight = 'bold';
            btn.style.fontFamily = 'Arial, sans-serif';
            btn.style.fontSize = '16px';
            btn.style.transition = 'background 0.3s, transform 0.3s';
            
            btn.onmouseover = () => {
                btn.style.background = '#45a049';
                btn.style.transform = 'scale(1.05)';
            };
            btn.onmouseout = () => {
                btn.style.background = '#4CAF50';
                btn.style.transform = 'scale(1)';
            };
            
            btn.onclick = () => {
               window.location.href = '../index.html';
            };
            
            document.body.appendChild(btn);
          }
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkAndAddButton);
        } else {
          checkAndAddButton();
        }
      })();
    </script>
</body>
